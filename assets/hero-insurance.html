<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Insurance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f7fb; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .ins { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; height: 100vh; padding: 24px; }

    /* ── Left: Pentagon/irregular shape with person ── */
    .ins-shape-wrap { position: relative; flex-shrink: 0; }

    .ins-shape {
      width: 300px; height: 340px;
      background: linear-gradient(160deg, #d6e4f5 0%, #b8ccdf 100%);
      clip-path: polygon(50% 0%, 100% 20%, 100% 80%, 70% 100%, 0% 100%, 0% 20%);
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    /* Person in suit -->*/
    .ins-person { display: flex; flex-direction: column; align-items: center; position: absolute; bottom: 0; }
    .ins-head { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #6b3f20, #7a4a28); position: relative; overflow: visible; }
    .ins-neck { width: 20px; height: 12px; background: #7a4a28; margin: 0 auto; }
    .ins-body { width: 160px; height: 190px; position: relative; }
    /* Suit -->*/
    .ins-suit { width: 100%; height: 100%; background: linear-gradient(160deg, #1a3a6e, #0f2850); border-radius: 50% 50% 0 0; position: absolute; }
    /* White shirt -->*/
    .ins-shirt { position: absolute; width: 30px; height: 90px; background: #f8fafc; left: 50%; transform: translateX(-50%); top: 20px; border-radius: 0 0 4px 4px; }
    /* Tie -->*/
    .ins-tie { position: absolute; width: 12px; background: #0D47A1; left: 50%; transform: translateX(-50%); top: 22px; height: 60px; border-radius: 0 0 5px 5px; }
    /* Lapels -->*/
    .ins-lapel-l { position: absolute; width: 28px; height: 50px; background: #0f2850; left: 38px; top: 15px; transform: rotate(-15deg); border-radius: 2px; }
    .ins-lapel-r { position: absolute; width: 28px; height: 50px; background: #0f2850; right: 38px; top: 15px; transform: rotate(15deg); border-radius: 2px; }
    /* Card in hand -->*/
    .ins-card-hand { position: absolute; bottom: 16px; right: 14px; width: 52px; height: 32px; background: linear-gradient(135deg,#1565C0,#0D47A1); border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
    .ins-card-chip { width: 12px; height: 9px; background: rgba(255,255,255,.4); border-radius: 2px; margin-right: 4px; }
    .ins-card-lines { display: flex; flex-direction: column; gap: 2px; }
    .ins-card-line { width: 16px; height: 2px; background: rgba(255,255,255,.5); border-radius: 1px; }
    .ins-card-line.short { width: 10px; }
    .ins-hair { position: absolute; top: 0; left: -4px; right: -4px; height: 30px; background: #1a0a00; border-radius: 50% 50% 0 0; }

    /* ── Right: Profile card ── */
    .ins-profile-card {
      background: #0f1f3d;
      border-radius: 18px;
      padding: 20px 22px;
      width: 240px;
      box-shadow: 0 16px 48px rgba(15,31,61,.35);
    }
    .ins-pc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .ins-pc-title { font-size: 18px; font-weight: 800; color: #fff; line-height: 1.3; }
    .ins-pc-step { font-size: 12px; color: rgba(255,255,255,.4); font-weight: 600; }

    /* Progress bar -->*/
    .ins-progress-track { height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
    .ins-progress-fill { height: 100%; background: #0D47A1; border-radius: 3px; width: 75%; transition: width 1.5s ease; }

    /* Shield -->*/
    .ins-shield-wrap { display: flex; justify-content: center; margin-bottom: 18px; }
    .ins-shield {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #1565C0, #0D47A1);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(13,71,161,.5);
    }
    .ins-shield svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .ins-insured { text-align: center; font-size: 12px; color: rgba(255,255,255,.5); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .ins-insured-name { text-align: center; font-size: 20px; font-weight: 800; color: #fff; letter-spacing: .5px; margin-bottom: 14px; }
    .ins-pc-body { font-size: 12px; color: rgba(255,255,255,.6); line-height: 1.65; margin-bottom: 18px; text-align: center; }
    .ins-pc-btn { background: #0D47A1; color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; transition: background .2s; }
    .ins-pc-btn:hover { background: #1565C0; }

    /* Animated ring on shield -->*/
    @keyframes pulseRing { 0%{transform:scale(1);opacity:.5} 100%{transform:scale(1.5);opacity:0} }
    .ins-shield-ring { position: absolute; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #0D47A1; animation: pulseRing 2s ease-out infinite; }
    .ins-shield-ring2 { animation-delay: .7s; }
    .ins-shield-container { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="ins">

  <!-- Person shape -->
  <div class="ins-shape-wrap">
    <div class="ins-shape">
      <div class="ins-person">
        <div class="ins-head">
          <div class="ins-hair"></div>
        </div>
        <div class="ins-neck"></div>
        <div class="ins-body">
          <div class="ins-suit"></div>
          <div class="ins-shirt"></div>
          <div class="ins-tie"></div>
          <div class="ins-lapel-l"></div>
          <div class="ins-lapel-r"></div>
          <div class="ins-card-hand">
            <div class="ins-card-chip"></div>
            <div class="ins-card-lines">
              <div class="ins-card-line"></div>
              <div class="ins-card-line short"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Insurance profile card -->
  <div class="ins-profile-card">
    <div class="ins-pc-head">
      <span class="ins-pc-title">Your Insurance<br/>Profile</span>
      <span class="ins-pc-step">3 of 4</span>
    </div>

    <div class="ins-progress-track">
      <div class="ins-progress-fill" id="insProg"></div>
    </div>

    <div class="ins-shield-wrap">
      <div class="ins-shield-container">
        <div class="ins-shield-ring"></div>
        <div class="ins-shield-ring ins-shield-ring2"></div>
        <div class="ins-shield">
          <svg viewBox="0 0 32 32">
            <path d="M16 3L5 7v8c0 7 5.5 11.5 11 13 5.5-1.5 11-6 11-13V7L16 3z"/>
            <circle cx="16" cy="16" r="4"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="ins-insured">INSURED</div>
    <div class="ins-insured-name">MICHAEL</div>

    <div class="ins-pc-body">Welcome back. Your key card with verified digital wallet credentials is ready. Please proceed with confidence.</div>

    <button class="ins-pc-btn" onclick="nextStep()">Continue to Step 4 →</button>
  </div>

</div>
<script>
  // Animate progress fill
  setTimeout(() => {
    document.getElementById('insProg').style.width = '75%';
  }, 400);

  let step = 3;
  function nextStep() {
    if (step >= 4) { step = 1; }
    else { step++; }
    document.querySelector('.ins-pc-step').textContent = `${step} of 4`;
    document.querySelector('.ins-insured-name').textContent = ['MICHAEL','SARAH','JAMES','AMARA'][step-1];
    const fill = document.getElementById('insProg');
    fill.style.width = '0%';
    setTimeout(() => { fill.style.width = (step / 4 * 100) + '%'; }, 100);
    const btn = document.querySelector('.ins-pc-btn');
    btn.textContent = step < 4 ? `Continue to Step ${step+1} →` : '✓ Profile Complete';
    if (step === 4) btn.style.background = '#16a34a';
    else btn.style.background = '#0D47A1';
  }
</script>
</body>
</html>
