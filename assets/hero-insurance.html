<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Insurance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #EEF5FD; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .ins { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 100vh; padding: 32px; }

    /* ── Shared card base ── */
    .ins-card {
      width: 100%; max-width: 340px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(13,71,161,.1), 0 2px 8px rgba(0,0,0,.05);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .ins-card.show { opacity: 1; transform: translateY(0); }

    /* ── Card 1: Policy holder ── */
    .ins-policy { padding: 16px; }
    .ins-policy-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .ins-av {
      width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #0D47A1, #1976D2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
    }
    .ins-holder-name { font-size: 15px; font-weight: 800; color: #0f172a; }
    .ins-holder-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
    .ins-expiry-badge {
      margin-left: auto; font-size: 10px; font-weight: 700;
      background: #fff7ed; color: #c2410c;
      border: 1px solid #fed7aa;
      padding: 4px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }

    .ins-policy-rows { display: flex; flex-direction: column; gap: 8px; }
    .ins-policy-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: #f8fafc; border-radius: 10px; border: 1px solid #f1f5f9; }
    .ins-policy-row-left { display: flex; align-items: center; gap: 8px; }
    .ins-row-icon { font-size: 14px; }
    .ins-row-label { font-size: 11px; font-weight: 700; color: #64748b; }
    .ins-row-val { font-size: 12px; font-weight: 800; color: #0f172a; }

    /* ── Card 2: Renewal reminder ── */
    .ins-reminder { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .ins-wa-icon {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      background: #25D366; display: flex; align-items: center; justify-content: center;
    }
    .ins-wa-icon svg { width: 22px; height: 22px; fill: #fff; }
    .ins-reminder-info { flex: 1; }
    .ins-reminder-title { font-size: 12px; font-weight: 800; color: #0f172a; }
    .ins-reminder-sub { font-size: 10px; color: #64748b; margin-top: 3px; line-height: 1.4; }
    .ins-reminder-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>
<div class="ins">

  <!-- Card 1: Policy holder -->
  <div class="ins-card" id="c1">
    <div class="ins-policy">
      <div class="ins-policy-top">
        <div class="ins-av">KA</div>
        <div>
          <div class="ins-holder-name">Kwame Asante</div>
          <div class="ins-holder-sub">Policy #GH-2025-00412</div>
        </div>
        <span class="ins-expiry-badge">⚠ Expires 1 Jun</span>
      </div>
      <div class="ins-policy-rows">
        <div class="ins-policy-row">
          <div class="ins-policy-row-left">
            <span class="ins-row-icon">🚗</span>
            <span class="ins-row-label">Coverage</span>
          </div>
          <span class="ins-row-val">Comprehensive Motor</span>
        </div>
        <div class="ins-policy-row">
          <div class="ins-policy-row-left">
            <span class="ins-row-icon">💳</span>
            <span class="ins-row-label">Premium</span>
          </div>
          <span class="ins-row-val">GH₵ 420 / yr</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Card 2: Renewal reminder -->
  <div class="ins-card" id="c2">
    <div class="ins-reminder">
      <div class="ins-wa-icon">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </div>
      <div class="ins-reminder-info">
        <div class="ins-reminder-title">Your motor policy renews in 14 days</div>
        <div class="ins-reminder-sub">Reply YES to renew · Sent via WhatsApp · ✓✓ Read</div>
      </div>
      <div class="ins-reminder-dot"></div>
    </div>
  </div>

</div>
<script>
  function runSequence() {
    ['c1','c2'].forEach(id => document.getElementById(id).classList.remove('show'));
    const delays = [300, 900];
    ['c1','c2'].forEach((id, i) => setTimeout(() => document.getElementById(id).classList.add('show'), delays[i]));
  }
  runSequence();
  setInterval(runSequence, 7000);
</script>
</body>
</html>
