<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Banking & Finance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #EEF5FD; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .bk { position: relative; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }

    /* ── Shield ── */
    .bk-shield-wrap {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 180px; height: 200px;
    }

    .bk-shield {
      width: 160px; height: 180px;
      background: linear-gradient(160deg, #1565C0, #0D47A1);
      clip-path: polygon(50% 0%, 100% 18%, 100% 60%, 50% 100%, 0% 60%, 0% 18%);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow: 0 20px 60px rgba(13,71,161,.45);
      animation: shieldPulse 4s ease-in-out infinite;
    }
    @keyframes shieldPulse { 0%,100%{box-shadow:0 20px 60px rgba(13,71,161,.45)} 50%{box-shadow:0 20px 80px rgba(13,71,161,.7)} }

    /* Outer glow ring */
    .bk-shield-glow {
      position: absolute;
      width: 200px; height: 220px;
      background: radial-gradient(ellipse at center, rgba(13,71,161,.18), transparent 70%);
      pointer-events: none;
    }

    /* Pulse rings */
    .bk-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(13,71,161,.25);
      animation: ringExpand 3s ease-out infinite;
      pointer-events: none;
    }
    .bk-ring:nth-child(1) { width: 240px; height: 240px; animation-delay: 0s; }
    .bk-ring:nth-child(2) { width: 310px; height: 310px; animation-delay: .8s; }
    .bk-ring:nth-child(3) { width: 380px; height: 380px; animation-delay: 1.6s; }
    @keyframes ringExpand { 0%{opacity:.7;transform:scale(.7)} 100%{opacity:0;transform:scale(1)} }

    /* Lock icon inside shield */
    .bk-lock {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      position: relative; z-index: 2;
    }
    .bk-lock svg { width: 52px; height: 52px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .bk-lock-label { font-size: 10px; font-weight: 800; color: rgba(255,255,255,.8); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }

    /* Shield facet sheen */
    .bk-shield::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
      clip-path: polygon(50% 0%, 100% 18%, 100% 60%, 50% 100%, 0% 60%, 0% 18%);
    }

    /* ── Floating stat cards ── */
    .bk-stat {
      position: absolute;
      background: #fff;
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.1);
      display: flex; align-items: center; gap: 10px;
      animation: floatCard var(--dur, 4s) ease-in-out infinite var(--delay, 0s);
      min-width: 150px;
    }
    @keyframes floatCard { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    .bk-stat-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px;
    }
    .bk-stat-val { font-size: 17px; font-weight: 800; color: #0D47A1; line-height: 1; }
    .bk-stat-lbl { font-size: 10px; color: #64748b; font-weight: 600; margin-top: 3px; }

    /* Positions */
    .bk-stat.s1 { top: 14%; left: 4%;  --dur: 3.8s; --delay: 0s; }
    .bk-stat.s2 { top: 14%; right: 4%; --dur: 4.2s; --delay: .6s; }
    .bk-stat.s3 { bottom: 16%; left: 50%; transform: translateX(-50%); --dur: 4s; --delay: 1.2s; animation: floatCardCenter var(--dur) ease-in-out infinite var(--delay); }
    @keyframes floatCardCenter { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-8px)} }

    /* Checkmark badge */
    .bk-check {
      position: absolute;
      bottom: -8px; right: -8px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #22c55e;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #fff; font-weight: 800;
      box-shadow: 0 2px 6px rgba(34,197,94,.4);
    }
  

    /* ── MOBILE SCALE ── */
    html, body { overflow-x: hidden; }
    @media (max-width: 768px) {
      html { font-size: 87.5%; }
      img, video, iframe { max-width: 100%; }
    }
    </style>
</head>
<body>
<div class="bk">

  <!-- Pulse rings -->
  <div class="bk-ring"></div>
  <div class="bk-ring"></div>
  <div class="bk-ring"></div>

  <!-- Shield -->
  <div class="bk-shield-wrap">
    <div class="bk-shield-glow"></div>
    <div class="bk-shield">
      <div class="bk-lock">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
          <circle cx="12" cy="16" r="1.5" fill="#fff" stroke="none"/>
        </svg>
        <span class="bk-lock-label">Secured</span>
      </div>
    </div>
  </div>

  <!-- Stat: Fraud Detection -->
  <div class="bk-stat s1">
    <div class="bk-stat-icon" style="background:#eff6ff;">🛡️</div>
    <div>
      <div class="bk-stat-val">99.2%</div>
      <div class="bk-stat-lbl">Fraud Detection</div>
    </div>
    <div class="bk-check">✓</div>
  </div>

  <!-- Stat: Alert Delivery -->
  <div class="bk-stat s2">
    <div class="bk-stat-icon" style="background:#f0fdf4;">⚡</div>
    <div>
      <div class="bk-stat-val">&lt;30s</div>
      <div class="bk-stat-lbl">Alert Delivery</div>
    </div>
    <div class="bk-check">✓</div>
  </div>

  <!-- Stat: Fraud Prevented -->
  <div class="bk-stat s3">
    <div class="bk-stat-icon" style="background:#fefce8;">💰</div>
    <div>
      <div class="bk-stat-val">$4.8M</div>
      <div class="bk-stat-lbl">Fraud Prevented</div>
    </div>
    <div class="bk-check">✓</div>
  </div>

</div>
</body>
</html>
