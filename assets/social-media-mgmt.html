<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Social Media Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #EEF5FD; height: 100vh; overflow: hidden; }

    .smm { display: flex; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: #fff; }

    /* Top bar */
    .smm-topbar { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
    .smm-page-title { font-size: 14px; font-weight: 800; color: #0f172a; }
    .smm-page-sub { font-size: 11px; color: #94a3b8; margin-top: 1px; }

    /* Tabs */
    .smm-tabs { display: flex; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
    .smm-tabs::-webkit-scrollbar { display: none; }
    .smm-tab { padding: 9px 13px; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
    .smm-tab:hover { color: #0D47A1; }
    .smm-tab.on { color: #0D47A1; border-bottom-color: #0D47A1; }
    .smm-tab-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Body */
    .smm-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Sentiment score row */
    .sent-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sent-chip { border-radius: 12px; padding: 12px 10px; text-align: center; }
    .sent-chip-val { font-size: 22px; font-weight: 800; line-height: 1; }
    .sent-chip-lbl { font-size: 10px; font-weight: 700; margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }
    .chip-pos { background: #f0fdf4; }
    .chip-pos .sent-chip-val { color: #16a34a; }
    .chip-pos .sent-chip-lbl { color: #16a34a; }
    .chip-neu { background: #f8fafc; }
    .chip-neu .sent-chip-val { color: #475569; }
    .chip-neu .sent-chip-lbl { color: #64748b; }
    .chip-neg { background: #fff1f2; }
    .chip-neg .sent-chip-val { color: #dc2626; }
    .chip-neg .sent-chip-lbl { color: #dc2626; }

    /* Distribution bar */
    .sent-bar-wrap { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 12px; padding: 12px 14px; }
    .sent-bar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 10px; }
    .sent-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; }
    .sent-bar-seg { height: 100%; border-radius: 3px; transition: width .6s ease; }
    .seg-pos { background: #22c55e; }
    .seg-neu { background: #94a3b8; }
    .seg-neg { background: #f87171; }
    .sent-bar-legend { display: flex; gap: 14px; margin-top: 8px; }
    .sent-leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #64748b; font-weight: 600; }
    .sent-leg-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Mentions */
    .smm-card { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 12px; padding: 13px; }
    .smm-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748b; margin-bottom: 10px; }
    .smm-mention { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
    .smm-mention:last-child { border-bottom: none; }
    .smm-men-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .smm-men-body { flex: 1; min-width: 0; }
    .smm-men-top { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .smm-men-name { font-size: 12px; font-weight: 700; color: #0f172a; }
    .smm-men-time { font-size: 10px; color: #94a3b8; margin-left: auto; }
    .smm-men-text { font-size: 11px; color: #64748b; line-height: 1.5; }
    .smm-men-sentiment { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-top: 4px; display: inline-block; }
    .sent-pos { background: #dcfce7; color: #16a34a; }
    .sent-neu { background: #f1f5f9; color: #64748b; }
    .sent-neg { background: #fee2e2; color: #dc2626; }
  

    /* ── MOBILE SCALE ── */
    html, body { overflow-x: hidden; }
    @media (max-width: 768px) {
      html { font-size: 87.5%; }
      img, video, iframe { max-width: 100%; }
    }
    </style>
</head>
<body>
<div class="smm">

  <div class="smm-topbar">
    <div class="smm-page-title">Sentiment Analysis</div>
    <div class="smm-page-sub" id="panelSub">Facebook · All Pages</div>
  </div>

  <div class="smm-tabs">
    <div class="smm-tab on" onclick="setTab(this,'facebook')">
      <span class="smm-tab-dot" style="background:#1877F2"></span>Facebook
    </div>
    <div class="smm-tab" onclick="setTab(this,'instagram')">
      <span class="smm-tab-dot" style="background:#e1306c"></span>Instagram
    </div>
    <div class="smm-tab" onclick="setTab(this,'twitter')">
      <span class="smm-tab-dot" style="background:#000"></span>X
    </div>
    <div class="smm-tab" onclick="setTab(this,'whatsapp')">
      <span class="smm-tab-dot" style="background:#25D366"></span>WhatsApp
    </div>
  </div>

  <div class="smm-body" id="smmBody"></div>

</div>
<script>
  const DATA = {
    facebook: {
      sub: 'Facebook · All Pages',
      pos: 68, neu: 22, neg: 10,
      mentions: [
        { init:'AK', color:'#7c3aed', name:'@amina.k',  time:'2m ago', text:'Just saw KronGage on my feed — this platform looks incredible! 🔥', sent:'pos' },
        { init:'TR', color:'#059669', name:'@t.rahman', time:'15m',    text:'When will the mobile app be available? Asking for a friend 😅',    sent:'neu' },
        { init:'JD', color:'#b45309', name:'@j.duarte', time:'1h',     text:'Support took too long to respond today — frustrating experience.',  sent:'neg' },
      ],
    },
    instagram: {
      sub: 'Instagram · @krongage',
      pos: 81, neu: 14, neg: 5,
      mentions: [
        { init:'LM', color:'#e1306c', name:'@lina.m',  time:'5m',  text:'The new collection reels are everything ✨ Already shared!',           sent:'pos' },
        { init:'PK', color:'#7c3aed', name:'@p.khan',  time:'22m', text:'Love the aesthetic but story links are broken on iOS 17?',             sent:'neu' },
        { init:'SO', color:'#0D47A1', name:'@sara.ou', time:'2h',  text:'Another banger post from @krongage 🙌 Tag someone who needs this!',    sent:'pos' },
      ],
    },
    twitter: {
      sub: 'X (Twitter) · @krongage',
      pos: 74, neu: 18, neg: 8,
      mentions: [
        { init:'MW', color:'#374151', name:'@m.wade',    time:'1m',  text:'KronGage just dropped a 🔥 update — real-time social listening!',     sent:'pos' },
        { init:'EL', color:'#7c3aed', name:'@elon.labs', time:'34m', text:'Solid platform but the API pricing is steep for SMEs.',               sent:'neu' },
        { init:'AB', color:'#059669', name:'@a.boateng', time:'3h',  text:'Impressed with the omnichannel capabilities. Switching from Zendesk.', sent:'pos' },
      ],
    },
    whatsapp: {
      sub: 'WhatsApp Business · All Numbers',
      pos: 72, neu: 19, neg: 9,
      mentions: [
        { init:'FN', color:'#25D366', name:'+44 7700 900111',  time:'3m',  text:'Hi, I received my order but one item is missing from the package.', sent:'neg' },
        { init:'GH', color:'#059669', name:'+233 24 000 1234', time:'18m', text:'Thank you for the quick delivery! Loved the packaging 😍',          sent:'pos' },
        { init:'KO', color:'#0D47A1', name:'+1 415 555 0180',  time:'1h',  text:'Can you confirm if the promo code SAVE20 is still active?',         sent:'neu' },
      ],
    },
  };

  function render(plat) {
    const d = DATA[plat];
    document.getElementById('panelSub').textContent = d.sub;
    document.getElementById('smmBody').innerHTML = `
      <div class="sent-row">
        <div class="sent-chip chip-pos">
          <div class="sent-chip-val">${d.pos}%</div>
          <div class="sent-chip-lbl">Positive</div>
        </div>
        <div class="sent-chip chip-neu">
          <div class="sent-chip-val">${d.neu}%</div>
          <div class="sent-chip-lbl">Neutral</div>
        </div>
        <div class="sent-chip chip-neg">
          <div class="sent-chip-val">${d.neg}%</div>
          <div class="sent-chip-lbl">Negative</div>
        </div>
      </div>

      <div class="sent-bar-wrap">
        <div class="sent-bar-label">Sentiment Distribution</div>
        <div class="sent-bar">
          <div class="sent-bar-seg seg-pos" style="width:${d.pos}%"></div>
          <div class="sent-bar-seg seg-neu" style="width:${d.neu}%"></div>
          <div class="sent-bar-seg seg-neg" style="width:${d.neg}%"></div>
        </div>
        <div class="sent-bar-legend">
          <div class="sent-leg-item"><div class="sent-leg-dot" style="background:#22c55e"></div>Positive</div>
          <div class="sent-leg-item"><div class="sent-leg-dot" style="background:#94a3b8"></div>Neutral</div>
          <div class="sent-leg-item"><div class="sent-leg-dot" style="background:#f87171"></div>Negative</div>
        </div>
      </div>

      <div class="smm-card">
        <div class="smm-card-title">Recent Mentions</div>
        ${d.mentions.map(m => `
          <div class="smm-mention">
            <div class="smm-men-av" style="background:${m.color}">${m.init}</div>
            <div class="smm-men-body">
              <div class="smm-men-top">
                <span class="smm-men-name">${m.name}</span>
                <span class="smm-men-time">${m.time}</span>
              </div>
              <div class="smm-men-text">${m.text}</div>
              <span class="smm-men-sentiment sent-${m.sent}">${m.sent === 'pos' ? 'Positive' : m.sent === 'neg' ? 'Negative' : 'Neutral'}</span>
            </div>
          </div>`).join('')}
      </div>`;
  }

  function setTab(tabEl, plat) {
    document.querySelectorAll('.smm-tab').forEach(t => t.classList.remove('on'));
    tabEl.classList.add('on');
    render(plat);
  }

  render('facebook');
</script>
</body>
</html>
