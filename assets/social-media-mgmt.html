<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Social Media Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; height: 100vh; overflow: hidden; }

    .smm { display: flex; width: 100%; height: 100vh; overflow: hidden; background: #fff; }

    /* ── Left: Visual blob + platform pill ── */
    .smm-visual {
      width: 300px; flex-shrink: 0;
      background: #f0f4f8;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* Big organic blob */
    .smm-blob {
      position: absolute;
      width: 260px; height: 280px;
      background: #0D47A1;
      border-radius: 62% 38% 46% 54% / 55% 45% 55% 45%;
      top: 50%; left: 50%;
      transform: translate(-40%, -50%);
      animation: blobMorph 8s ease-in-out infinite;
    }
    @keyframes blobMorph {
      0%,100% { border-radius: 62% 38% 46% 54% / 55% 45% 55% 45%; }
      33%      { border-radius: 42% 58% 56% 44% / 48% 52% 48% 52%; }
      66%      { border-radius: 55% 45% 38% 62% / 42% 58% 42% 58%; }
    }

    /* Right decorative ring */
    .smm-blob-ring {
      position: absolute;
      width: 100px; height: 120px;
      border: 2.5px solid #0D47A1;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      right: 8px; top: 55%;
      transform: translateY(-50%);
    }

    /* Phone + person illustration */
    .smm-person-wrap {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
    }
    .smm-person-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #d4a876, #c49060);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .smm-person-body {
      width: 120px; height: 130px;
      background: linear-gradient(160deg, #1a3a6e, #0d2654);
      border-radius: 50% 50% 0 0;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 16px;
    }
    .smm-phone {
      width: 50px; height: 86px;
      background: #0f172a;
      border-radius: 10px;
      border: 2px solid #334155;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .smm-phone-screen {
      width: 40px; height: 70px;
      border-radius: 6px;
      background: linear-gradient(160deg, #1e40af, #0D47A1);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      overflow: hidden;
    }
    .smm-phone-bar { width: 28px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.4); }
    .smm-phone-bar.w2 { width: 20px; }
    .smm-phone-bar.blue { background: #60a5fa; }
    .smm-phone-notif { position: absolute; top: -6px; right: -6px; width: 14px; height: 14px; background: #ef4444; border-radius: 50%; border: 2px solid #f0f4f8; font-size: 8px; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; }

    /* Platform pill sidebar */
    .smm-platform-pill {
      position: absolute;
      left: 14px;
      top: 50%; transform: translateY(-50%);
      background: #0f172a;
      border-radius: 20px;
      padding: 12px 10px;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
      z-index: 20;
    }
    .smm-plat-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .smm-plat-icon:hover { transform: scale(1.15); }
    .smm-plat-icon.active { box-shadow: 0 0 0 2px #fff; }
    .smm-plat-icon svg { width: 18px; height: 18px; fill: #fff; }

    /* ── Right: Dashboard ── */
    .smm-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* Top bar */
    .smm-topbar {
      padding: 12px 20px; border-bottom: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .smm-page-title { font-size: 16px; font-weight: 800; color: #0f172a; }
    .smm-page-sub { font-size: 12px; color: #94a3b8; }
    .smm-topbar-right { display: flex; align-items: center; gap: 10px; }
    .smm-btn { padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; border: 1px solid #e2e8f0; background: #fff; color: #475569; cursor: pointer; transition: all .15s; }
    .smm-btn:hover { border-color: #93c5fd; color: #0D47A1; }
    .smm-btn.pri { background: #0D47A1; color: #fff; border-color: #0D47A1; }
    .smm-btn.pri:hover { background: #0a3a84; }

    /* Platform tabs */
    .smm-tabs { display: flex; gap: 0; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; padding: 0 20px; }
    .smm-tab { padding: 10px 16px; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; display: flex; align-items: center; gap: 6px; }
    .smm-tab:hover { color: #0D47A1; }
    .smm-tab.on { color: #0D47A1; border-bottom-color: #0D47A1; }
    .smm-tab-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Body */
    .smm-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

    /* KPI row */
    .smm-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .smm-kpi { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 10px; padding: 12px 14px; transition: all .2s; cursor: pointer; }
    .smm-kpi:hover { border-color: #93c5fd; box-shadow: 0 2px 12px rgba(13,71,161,.08); }
    .smm-kpi-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 5px; }
    .smm-kpi-val { font-size: 18px; font-weight: 800; color: #0f172a; letter-spacing: -.5px; }
    .smm-kpi-delta { font-size: 11px; font-weight: 700; margin-top: 3px; }

    /* Two-col grid */
    .smm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Mentions feed */
    .smm-card { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 12px; padding: 14px; }
    .smm-card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748b; margin-bottom: 12px; }
    .smm-mention { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; }
    .smm-mention:last-child { border-bottom: none; }
    .smm-men-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .smm-men-body { flex: 1; min-width: 0; }
    .smm-men-top { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .smm-men-name { font-size: 12px; font-weight: 700; color: #0f172a; }
    .smm-men-plat { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
    .smm-men-time { font-size: 10px; color: #94a3b8; margin-left: auto; }
    .smm-men-text { font-size: 11px; color: #64748b; line-height: 1.5; }
    .smm-men-sentiment { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-top: 5px; display: inline-block; }
    .sent-pos { background: #dcfce7; color: #16a34a; }
    .sent-neu { background: #f1f5f9; color: #64748b; }
    .sent-neg { background: #fee2e2; color: #dc2626; }

    /* Posting schedule */
    .smm-sched { display: flex; flex-direction: column; gap: 8px; }
    .smm-sched-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff; border: 1px solid #f1f5f9; border-radius: 8px; cursor: pointer; transition: all .15s; }
    .smm-sched-item:hover { border-color: #93c5fd; box-shadow: 0 2px 8px rgba(13,71,161,.08); }
    .smm-sched-plat { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .smm-sched-info { flex: 1; }
    .smm-sched-title { font-size: 12px; font-weight: 700; color: #0f172a; }
    .smm-sched-time { font-size: 11px; color: #64748b; }
    .smm-sched-status { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    .ss-live { background: #dcfce7; color: #16a34a; }
    .ss-sched { background: #dbeafe; color: #1d4ed8; }
    .ss-draft { background: #f1f5f9; color: #64748b; }
  </style>

            <div class="smm-kpi-lbl">${k.lbl}</div>
            <div class="smm-kpi-val">${k.val}</div>
            <div class="smm-kpi-delta ${k.up?'up':'dn'}">${k.delta}</div>
          </div>`).join('')}
      </div>
      <div class="smm-grid">
        <div class="smm-card">
          <div class="smm-card-title">Recent Mentions</div>
          ${d.mentions.map(m=>`
            <div class="smm-mention">
              <div class="smm-men-av" style="background:${m.color}">${m.init}</div>
              <div class="smm-men-body">
                <div class="smm-men-top">
                  <span class="smm-men-name">${m.name}</span>
                  <span class="smm-men-plat" style="${m.platCls};padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;">${m.plat}</span>
                  <span class="smm-men-time">${m.time}</span>
                </div>
                <div class="smm-men-text">${m.text}</div>
                <span class="smm-men-sentiment sent-${m.sent}">${m.sent==='pos'?'Positive':m.sent==='neg'?'Negative':'Neutral'}</span>
              </div>
            </div>`).join('')}
        </div>
        <div class="smm-card">
          <div class="smm-card-title">Scheduled Posts</div>
          <div class="smm-sched">
            ${d.schedule.map(s=>`
              <div class="smm-sched-item">
                <div class="smm-sched-plat" style="background:${s.bg}">${s.icon}</div>
                <div class="smm-sched-info">
                  <div class="smm-sched-title">${s.title}</div>
                  <div class="smm-sched-time">${s.time}</div>
                </div>
                <span class="smm-sched-status ${s.status}">${s.sl}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>`;

    // Update tabs
    document.querySelectorAll('.smm-tab').forEach(t => t.classList.remove('on'));
    const tabMap = {facebook:1,instagram:2,twitter:3,whatsapp:0};
    document.querySelectorAll('.smm-tab')[tabMap[plat]].classList.add('on');

    // Update pill icons
    document.querySelectorAll('.smm-plat-icon').forEach(i=>i.classList.remove('active'));
    const platOrder = ['whatsapp','facebook','instagram','twitter'];
    const idx = platOrder.indexOf(plat);
    if (idx>=0) document.querySelectorAll('.smm-plat-icon')[idx].classList.add('active');
  }

  function setTab(icon, plat) {
    activePlatform = plat;
    renderPanel(plat);
  }

  function setTabByName(tab, plat) {
    activePlatform = plat;
    renderPanel(plat);
  }

  // Animate notification badge
  let notifCount = 3;
  setInterval(() => {
    const rand = Math.floor(Math.random()*3);
    if (rand === 0 && notifCount < 9) notifCount++;
    document.getElementById('phoneNotif').textContent = notifCount;
  }, 4000);

  renderPanel('facebook');
</script>
</body>
</html>
