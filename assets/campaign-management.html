<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Campaign Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .cm { display: flex; align-items: stretch; gap: 24px; width: 100%; max-width: 900px; padding: 24px; height: 100vh; overflow: hidden; }

    /* ── Left: Team org ── */
    .cm-left {
      width: 260px; flex-shrink: 0;
      display: flex; flex-direction: column; justify-content: center; gap: 0;
    }

    .cm-person-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      cursor: pointer;
      transition: box-shadow .2s, transform .2s;
      position: relative;
    }
    .cm-person-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,.14); transform: translateY(-2px); }
    .cm-person-card.active { border: 2px solid #0D47A1; }

    .cm-av {
      width: 52px; height: 52px; border-radius: 50%;
      flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff;
    }
    .cm-info { flex: 1; min-width: 0; }
    .cm-name { font-size: 15px; font-weight: 800; color: #0f172a; }
    .cm-meta { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
    .cm-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .online { background: #4ade80; box-shadow: 0 0 5px rgba(74,222,128,.6); }
    .offline { background: #94a3b8; }
    .cm-status-text { font-size: 12px; color: #64748b; font-weight: 600; }
    .cm-role-badge {
      font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      background: #0D47A1; color: #fff; white-space: nowrap;
    }
    .cm-role-inline { font-size: 12px; font-weight: 700; color: #0D47A1; }

    /* Connector */
    .cm-connector {
      display: flex; align-items: flex-start;
      padding: 0 0 0 34px; margin: 0;
      height: 40px;
    }
    .cm-conn-line {
      width: 2px; height: 40px;
      background: linear-gradient(to bottom, #0D47A1, #0D47A1);
      border-radius: 1px;
      position: relative;
    }
    .cm-conn-line::after {
      content: '';
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%;
      background: #0D47A1;
    }

    /* Campaign progress */
    .cm-campaign-card {
      background: #EEF5FD;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 20px;
    }
    .cm-camp-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748b; margin-bottom: 8px; }
    .cm-camp-name { font-size: 13px; font-weight: 800; color: #0D47A1; margin-bottom: 10px; }
    .cm-prog-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .cm-prog-label { font-size: 11px; font-weight: 600; color: #374151; }
    .cm-prog-pct { font-size: 11px; font-weight: 700; color: #0D47A1; }
    .cm-prog-track { height: 6px; background: #dbeafe; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
    .cm-prog-fill { height: 100%; background: #0D47A1; border-radius: 3px; transition: width 1s ease; }
    .cm-camp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .cm-chip { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 5px; background: #0D47A1; color: #fff; }
    .cm-chip.fb { background: #1877F2; }
    .cm-chip.ig { background: #e1306c; }
    .cm-chip.em { background: #059669; }
    .cm-chip.sms { background: #7c3aed; }

    /* ── Right: Activity timeline ── */
    .cm-activity {
      flex: 1; min-width: 0;
      background: #0f172a;
      border-radius: 20px;
      padding: 22px 22px 16px;
      overflow-y: auto;
      box-shadow: 0 8px 40px rgba(15,23,42,.3);
    }
    .cm-act-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .cm-act-title { font-size: 22px; font-weight: 800; color: #fff; }
    .cm-act-filter {
      display: flex; gap: 6px;
    }
    .cm-af { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700;
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.5); cursor: pointer; border: none; transition: all .2s; }
    .cm-af.on { background: #0D47A1; color: #fff; }
    .cm-af:hover { background: rgba(255,255,255,.15); color: #fff; }

    .cm-timeline { display: flex; flex-direction: column; gap: 0; }

    .cm-titem {
      display: flex; gap: 14px; padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      cursor: pointer; transition: background .2s; border-radius: 6px; padding-left: 4px;
    }
    .cm-titem:last-child { border-bottom: none; }
    .cm-titem:hover { background: rgba(255,255,255,.03); }
    .cm-titem.expanded { background: rgba(13,71,161,.15); }

    .cm-t-time { font-size: 11px; color: rgba(255,255,255,.35); font-weight: 600; min-width: 50px; text-align: right; flex-shrink: 0; padding-top: 2px; }
    .cm-t-icon-wrap { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .cm-t-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 12px;
    }
    .ti-done { background: #0D47A1; color: #fff; }
    .ti-pend { background: rgba(255,255,255,.15); color: rgba(255,255,255,.5); }
    .ti-warn { background: #b45309; color: #fff; }
    .cm-t-vline { width: 1px; flex: 1; background: rgba(255,255,255,.08); margin-top: 4px; min-height: 20px; }
    .cm-titem:last-child .cm-t-vline { display: none; }

    .cm-t-body { flex: 1; min-width: 0; }
    .cm-t-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .cm-t-title.pending { color: rgba(255,255,255,.6); }
    .cm-t-sub { font-size: 12px; color: rgba(255,255,255,.4); line-height: 1.5; }
    .cm-t-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 700; color: #60a5fa;
      margin-top: 5px; cursor: pointer; text-decoration: none;
    }
    .cm-t-link:hover { color: #93c5fd; }
    .cm-t-expand { margin-top: 8px; background: rgba(255,255,255,.05); border-radius: 8px; padding: 10px; display: none; }
    .cm-titem.expanded .cm-t-expand { display: block; }
    .cm-t-expand-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .cm-t-metric { display: flex; flex-direction: column; }
    .cm-t-metric-lbl { font-size: 10px; color: rgba(255,255,255,.35); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
    .cm-t-metric-val { font-size: 14px; font-weight: 800; color: #60a5fa; }
  </style>
</head>
<body>
<div class="cm">

  <!-- Left: Team + Campaign -->
  <div class="cm-left">

    <div class="cm-person-card" onclick="selectPerson(this, 'efua')">
      <div class="cm-av" style="background:linear-gradient(135deg,#7c3aed,#5b21b6)">EM</div>
      <div class="cm-info">
        <div class="cm-name">Efua Mensah</div>
        <div class="cm-meta">
          <div class="cm-status-dot offline"></div>
          <span class="cm-status-text">Offline</span>
          <span class="cm-role-inline">Lead Strategist</span>
        </div>
      </div>
    </div>

    <div class="cm-connector">
      <div class="cm-conn-line"></div>
    </div>

    <div class="cm-person-card active" onclick="selectPerson(this, 'kofi')">
      <div class="cm-av" style="background:linear-gradient(135deg,#0D47A1,#1565C0)">KM</div>
      <div class="cm-info">
        <div class="cm-name">Kofi Manu</div>
        <div class="cm-meta">
          <div class="cm-status-dot online"></div>
          <span class="cm-status-text">Online</span>
        </div>
      </div>
      <span class="cm-role-badge">Campaign Mgr</span>
    </div>

    <div class="cm-campaign-card">
      <div class="cm-camp-label">Active Campaign</div>
      <div class="cm-camp-name">Holiday '24 — Q4 Launch</div>
      <div class="cm-prog-row">
        <span class="cm-prog-label">Completion</span>
        <span class="cm-prog-pct">72%</span>
      </div>
      <div class="cm-prog-track">
        <div class="cm-prog-fill" style="width:72%"></div>
      </div>
      <div class="cm-camp-chips">
        <span class="cm-chip fb">Facebook</span>
        <span class="cm-chip ig">Instagram</span>
        <span class="cm-chip em">Email</span>
        <span class="cm-chip sms">SMS</span>
      </div>
    </div>

  </div>

  <!-- Right: Activity -->
  <div class="cm-activity">
    <div class="cm-act-head">
      <span class="cm-act-title">Activity</span>
      <div class="cm-act-filter">
        <button class="cm-af on" onclick="filterAct(this,'all')">All</button>
        <button class="cm-af" onclick="filterAct(this,'done')">Done</button>
        <button class="cm-af" onclick="filterAct(this,'pending')">Pending</button>
      </div>
    </div>

    <div class="cm-timeline" id="timeline"></div>
  </div>

</div>
<script>
  const ACTIVITIES = [
    {
      id: 1, time: '12d ago', status: 'done',
      title: 'Campaign brief defined for Q4 Launch',
      sub: '',
      metrics: [
        { lbl: 'Budget', val: '$48k' },
        { lbl: 'Channels', val: '4' },
        { lbl: 'Duration', val: '6 weeks' },
      ],
    },
    {
      id: 2, time: '6d ago', status: 'done',
      title: 'Creative assets approved',
      sub: 'Campaign: Holiday\'24, Channels: FB/IG',
      link: 'Review assets',
      metrics: [
        { lbl: 'Assets', val: '24' },
        { lbl: 'Formats', val: 'Static + Video' },
        { lbl: 'Approved by', val: 'E. Mensah' },
      ],
    },
    {
      id: 3, time: '3d ago', status: 'pending',
      title: 'Post scheduling complete',
      sub: 'Tools: Hootsuite, Status: Draft',
      metrics: [
        { lbl: 'Scheduled', val: '48 posts' },
        { lbl: 'Status', val: 'Draft' },
        { lbl: 'Go-live', val: 'Dec 1' },
      ],
    },
    {
      id: 4, time: '1d ago', status: 'done',
      title: 'Ad set optimization complete',
      sub: 'ROAS: 4.5x, Adjusted spend: $2k/day',
      metrics: [
        { lbl: 'ROAS', val: '4.5x' },
        { lbl: 'Daily Spend', val: '$2,000' },
        { lbl: 'CPA', val: '$8.40' },
      ],
    },
    {
      id: 5, time: '4h ago', status: 'done',
      title: 'Engagement report generated',
      sub: 'Total Reach: 150k, CTR: 3.1%',
      link: 'View report',
      metrics: [
        { lbl: 'Reach', val: '150k' },
        { lbl: 'CTR', val: '3.1%' },
        { lbl: 'Impressions', val: '4.8M' },
      ],
    },
  ];

  let activeFilter = 'all';
  let expandedId = null;

  function iconCls(status) { return status==='done'?'ti-done':status==='warn'?'ti-warn':'ti-pend'; }
  function iconChar(status) { return status==='done'?'✓':status==='warn'?'!':'◯'; }

  function renderTimeline() {
    const items = activeFilter==='all' ? ACTIVITIES
      : activeFilter==='done' ? ACTIVITIES.filter(a=>a.status==='done')
      : ACTIVITIES.filter(a=>a.status!=='done');

    document.getElementById('timeline').innerHTML = items.map(a => `
      <div class="cm-titem${expandedId===a.id?' expanded':''}" onclick="toggleExpand(${a.id})">
        <span class="cm-t-time">${a.time}</span>
        <div class="cm-t-icon-wrap">
          <div class="cm-t-icon ${iconCls(a.status)}">${iconChar(a.status)}</div>
          <div class="cm-t-vline"></div>
        </div>
        <div class="cm-t-body">
          <div class="cm-t-title${a.status!=='done'?' pending':''}">${a.title}</div>
          ${a.sub ? `<div class="cm-t-sub">${a.sub}</div>` : ''}
          ${a.link ? `<span class="cm-t-link">${a.link} ↗</span>` : ''}
          <div class="cm-t-expand">
            <div class="cm-t-expand-row">
              ${a.metrics.map(m=>`<div class="cm-t-metric"><span class="cm-t-metric-lbl">${m.lbl}</span><span class="cm-t-metric-val">${m.val}</span></div>`).join('')}
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    renderTimeline();
  }

  function filterAct(btn, filter) {
    document.querySelectorAll('.cm-af').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    activeFilter = filter;
    renderTimeline();
  }

  function selectPerson(card, person) {
    document.querySelectorAll('.cm-person-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
  }

  renderTimeline();
</script>
</body>
</html>
