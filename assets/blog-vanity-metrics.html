<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanity Metrics Thumbnail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8fafc;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .scene {
      width: 100%; height: 100%;
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 0;
      position: relative;
    }

    /* divider */
    .divider {
      background: #e2e8f0;
      height: 70%; align-self: center;
      position: relative;
    }
    .divider::after {
      content: 'vs';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #f8fafc;
      color: #94a3b8;
      font-size: 10px; font-weight: 800;
      padding: 4px 6px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }

    /* ── Left: vanity ── */
    .vanity-panel {
      padding: 20px 24px 20px 28px;
      display: flex; flex-direction: column; justify-content: center; gap: 12px;
      position: relative;
      transition: opacity .8s ease;
    }
    .vanity-panel.dimmed { opacity: .35; }
    .panel-label {
      font-size: 10px; font-weight: 800; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .vanity-panel .panel-label { color: #94a3b8; }
    .value-panel .panel-label { color: #0D47A1; }

    .vanity-stat {
      display: flex; flex-direction: column;
    }
    .v-num {
      font-size: 28px; font-weight: 900; line-height: 1;
      color: #94a3b8;
    }
    .v-label { font-size: 10px; font-weight: 600; color: #cbd5e1; margin-top: 3px; }
    .v-tag {
      display: inline-block; font-size: 9px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
      background: #fee2e2; color: #dc2626;
      margin-top: 3px; align-self: flex-start;
    }

    /* ── Right: value ── */
    .value-panel {
      padding: 20px 28px 20px 24px;
      display: flex; flex-direction: column; justify-content: center; gap: 10px;
      position: relative;
    }
    .value-stat {
      display: flex; align-items: center; gap: 12px;
    }
    .v-icon {
      width: 34px; height: 34px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .v-info { flex: 1; }
    .v-metric { font-size: 10px; font-weight: 700; color: #64748b; margin-bottom: 2px; }
    .v-val { font-size: 20px; font-weight: 900; line-height: 1; }
    .v-delta {
      font-size: 10px; font-weight: 700; margin-top: 2px;
    }

    /* Sparkline */
    .sparkline-wrap { margin-top: 2px; }

    /* animated count */
    .counting { transition: none; }

    /* glow on value panel */
    .value-panel::before {
      content: '';
      position: absolute; inset: 8px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(13,71,161,.04), rgba(34,197,94,.04));
      border: 1px solid rgba(13,71,161,.08);
      pointer-events: none;
    }
  

    /* ── MOBILE SCALE ── */
    html, body { overflow-x: hidden; }
    @media (max-width: 768px) {
      html { font-size: 87.5%; }
    }
    </style>
</head>
<body>
<div class="scene">

  <!-- Left: vanity metrics -->
  <div class="vanity-panel" id="vanityPanel">
    <div class="panel-label">What you track</div>

    <div class="vanity-stat">
      <div class="v-num" id="v1">2.4M</div>
      <div class="v-label">Monthly impressions</div>
      <div class="v-tag">No action signal</div>
    </div>
    <div class="vanity-stat">
      <div class="v-num" id="v2">38%</div>
      <div class="v-label">Email open rate</div>
      <div class="v-tag">Alone, meaningless</div>
    </div>
    <div class="vanity-stat">
      <div class="v-num" id="v3">12K</div>
      <div class="v-label">New followers</div>
      <div class="v-tag">Doesn't pay bills</div>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Right: value metrics -->
  <div class="value-panel">
    <div class="panel-label">What actually matters</div>

    <div class="value-stat">
      <div class="v-icon" style="background:#dcfce7">📈</div>
      <div class="v-info">
        <div class="v-metric">Net Revenue Retention</div>
        <div class="v-val" style="color:#15803d" id="nrr">112%</div>
        <div class="v-delta" style="color:#15803d">↑ +8pp vs last year</div>
      </div>
    </div>

    <div class="value-stat">
      <div class="v-icon" style="background:#dbeafe">💰</div>
      <div class="v-info">
        <div class="v-metric">Customer Lifetime Value</div>
        <div class="v-val" style="color:#0D47A1" id="ltv">$840</div>
        <div class="v-delta" style="color:#0D47A1">↑ up from $590</div>
      </div>
    </div>

    <div class="value-stat">
      <div class="v-icon" style="background:#fef9c3">⚡</div>
      <div class="v-info">
        <div class="v-metric">Churn Rate</div>
        <div class="v-val" style="color:#d97706" id="churn">2.1%</div>
        <div class="v-delta" style="color:#d97706">↓ down from 6.4%</div>
      </div>
    </div>

    <!-- Sparkline SVG -->
    <svg viewBox="0 0 200 36" style="width:100%;margin-top:4px">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0D47A1" stop-opacity=".25"/>
          <stop offset="100%" stop-color="#0D47A1" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="sparkFill" d="" fill="url(#sg)"/>
      <path id="sparkLine" d="" fill="none" stroke="#0D47A1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

</div>
<script>
  // Draw sparkline (retention curve, upward trend)
  const pts = [
    [0,30],[25,26],[50,22],[75,19],[100,15],[125,12],[150,9],[175,7],[200,4]
  ];
  const linePath = 'M' + pts.map(p => p.join(',')).join(' L');
  const fillPath = linePath + ' L200,36 L0,36 Z';
  document.getElementById('sparkLine').setAttribute('d', linePath);
  document.getElementById('sparkFill').setAttribute('d', fillPath);

  // Animate sparkline draw
  const line = document.getElementById('sparkLine');
  const len = line.getTotalLength();
  line.style.strokeDasharray = len;
  line.style.strokeDashoffset = len;
  line.style.transition = 'stroke-dashoffset 1.8s ease .5s';
  setTimeout(() => line.style.strokeDashoffset = 0, 100);

  // Dim vanity panel after 2.5s, then cycle
  function dimVanity() {
    document.getElementById('vanityPanel').classList.add('dimmed');
    setTimeout(() => {
      document.getElementById('vanityPanel').classList.remove('dimmed');
      setTimeout(dimVanity, 2000);
    }, 3000);
  }
  setTimeout(dimVanity, 1200);
</script>
</body>
</html>
