<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – AI Automation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #EEF5FD; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .ai-wrap { position: relative; display: flex; align-items: center; justify-content: center; gap: 0; width: 100%; height: 100%; }

    /* ── Person circle frame ── */
    .ai-person-frame {
      position: relative; flex-shrink: 0;
      width: 200px; height: 200px; border-radius: 50%;
      background: linear-gradient(145deg, #c8dff5 0%, #a8c8e8 100%);
      box-shadow: 0 12px 48px rgba(13,71,161,.2);
      overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
    }

    /* Person silhouette */
    .ai-person { position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; }
    .ai-head { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #8B5A2B, #6B4423); position: relative; }
    .ai-hair { position: absolute; top: -2px; left: -3px; right: -3px; height: 32px; background: #1a0a00; border-radius: 50% 50% 0 0; }
    .ai-neck { width: 18px; height: 10px; background: #7a4a28; margin: 0 auto; }
    .ai-body { width: 130px; height: 160px; background: linear-gradient(160deg, #2563eb, #1d4ed8); border-radius: 50% 50% 0 0; position: relative; }
    .ai-shirt-white { position: absolute; width: 26px; height: 70px; background: #f8fafc; left: 50%; transform: translateX(-50%); top: 16px; border-radius: 0 0 4px 4px; }

    /* Phone in hand */
    .ai-phone { position: absolute; bottom: 16px; right: 18px; width: 34px; height: 58px; background: #0f172a; border-radius: 6px; border: 1.5px solid #334155; }
    .ai-phone-screen { width: 24px; height: 44px; border-radius: 4px; background: linear-gradient(160deg, #dbeafe, #0D47A1); margin: 4px auto; }

    /* Robot badge top-right */
    .ai-bot-badge {
      position: absolute; top: 8px; right: 8px;
      width: 36px; height: 36px; border-radius: 10px;
      background: #0D47A1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(13,71,161,.4);
    }
    .ai-bot-badge svg { width: 20px; height: 20px; fill: #fff; }

    /* ── Chat bubbles ── */
    .ai-bubbles { display: flex; flex-direction: column; gap: 14px; padding: 20px; flex: 1; max-width: 240px; }

    .ai-bubble-bot {
      background: #0f1f3d;
      border-radius: 14px 14px 14px 4px;
      padding: 12px 14px;
      display: flex; align-items: flex-start; gap: 9px;
      opacity: 0; transform: translateX(-12px);
      transition: opacity .5s, transform .5s;
    }
    .ai-bubble-bot.show { opacity: 1; transform: translateX(0); }
    .ai-bot-avatar {
      width: 26px; height: 26px; border-radius: 7px;
      background: #0D47A1; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    .ai-bot-avatar svg { width: 14px; height: 14px; fill: #fff; }
    .ai-bubble-text { font-size: 12px; color: rgba(255,255,255,.85); line-height: 1.55; font-weight: 500; }

    .ai-bubble-user {
      background: #fff;
      border-radius: 14px 14px 4px 14px;
      padding: 11px 14px;
      margin-left: 28px;
      font-size: 12px; color: #0f172a; line-height: 1.5; font-weight: 500;
      opacity: 0; transform: translateX(12px);
      transition: opacity .5s, transform .5s;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .ai-bubble-user.show { opacity: 1; transform: translateX(0); }

    /* Typing indicator */
    .ai-typing {
      background: #0f1f3d;
      border-radius: 14px 14px 14px 4px;
      padding: 11px 16px;
      display: inline-flex; gap: 5px; align-items: center;
      opacity: 0; transform: translateX(-12px);
      transition: opacity .4s, transform .4s;
      margin-left: 35px;
    }
    .ai-typing.show { opacity: 1; transform: translateX(0); }
    .ai-typing span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); animation: tdot 1.2s ease infinite; }
    .ai-typing span:nth-child(2) { animation-delay: .2s; }
    .ai-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes tdot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* Stats chip */
    .ai-stat {
      background: #fff; border-radius: 10px; padding: 9px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      opacity: 0; transform: translateY(8px);
      transition: opacity .5s, transform .5s;
    }
    .ai-stat.show { opacity: 1; transform: translateY(0); }
    .ai-stat-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: blink 1.5s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .ai-stat-text { font-size: 11px; font-weight: 700; color: #0f172a; }
    .ai-stat-sub { font-size: 10px; color: #64748b; }
  </style>
</head>
<body>
<div class="ai-wrap">

  <!-- Person frame -->
  <div class="ai-person-frame">
    <div class="ai-person">
      <div class="ai-head">
        <div class="ai-hair"></div>
      </div>
      <div class="ai-neck"></div>
      <div class="ai-body">
        <div class="ai-shirt-white"></div>
        <div class="ai-phone"><div class="ai-phone-screen"></div></div>
      </div>
    </div>
    <div class="ai-bot-badge">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 8V5a4 4 0 018 0v3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/></svg>
    </div>
  </div>

  <!-- Chat bubbles -->
  <div class="ai-bubbles">
    <div class="ai-bubble-bot" id="cb1">
      <div class="ai-bot-avatar">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 8V6a4 4 0 018 0v2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/></svg>
      </div>
      <span class="ai-bubble-text">Hello! What can I help you with today?</span>
    </div>

    <div class="ai-bubble-user" id="cu1">I want to confirm my appointment.</div>

    <div class="ai-typing" id="ct1">
      <span></span><span></span><span></span>
    </div>

    <div class="ai-bubble-bot" id="cb2">
      <div class="ai-bot-avatar">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 8V6a4 4 0 018 0v2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="9" cy="13" r="1.5" fill="#fff"/><circle cx="15" cy="13" r="1.5" fill="#fff"/></svg>
      </div>
      <span class="ai-bubble-text">Got it! Let me check you in. ✅ Appointment confirmed for Friday 3:00 PM.</span>
    </div>

    <div class="ai-stat" id="cs1">
      <div class="ai-stat-dot"></div>
      <div>
        <div class="ai-stat-text">AI Copilot Active</div>
        <div class="ai-stat-sub">Avg. 1.8s response time</div>
      </div>
    </div>
  </div>

</div>
<script>
  function runSequence() {
    const els = ['cb1','cu1','ct1','cb2','cs1'];
    els.forEach(id => document.getElementById(id).classList.remove('show'));

    const delays = [300, 900, 1500, 2400, 3100];
    const hide = ['ct1'];
    els.forEach((id, i) => {
      setTimeout(() => {
        document.getElementById(id).classList.add('show');
        if (id === 'cb2') {
          setTimeout(() => document.getElementById('ct1').classList.remove('show'), 50);
        }
      }, delays[i]);
    });
  }
  runSequence();
  setInterval(runSequence, 8000);
</script>
</body>
</html>
