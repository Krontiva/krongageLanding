<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – AI Automation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a1628; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .ai-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 100%; padding: 28px; }

    /* Bot bubble */
    .ai-bubble-bot {
      width: 100%; max-width: 340px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px 14px 14px 4px;
      padding: 12px 14px;
      display: flex; align-items: flex-start; gap: 10px;
      opacity: 0; transform: translateX(-12px);
      transition: opacity .5s, transform .5s;
    }
    .ai-bubble-bot.show { opacity: 1; transform: translateX(0); }

    .ai-bot-avatar {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      background: #0D47A1;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    .ai-bot-avatar svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ai-bubble-text { font-size: 12px; color: rgba(255,255,255,.85); line-height: 1.6; font-weight: 500; }

    /* User bubble */
    .ai-bubble-user {
      width: 100%; max-width: 340px;
      background: #fff;
      border-radius: 14px 14px 4px 14px;
      padding: 11px 14px;
      padding-left: 42px;
      font-size: 12px; color: #0f172a; line-height: 1.5; font-weight: 500;
      opacity: 0; transform: translateX(12px);
      transition: opacity .5s, transform .5s;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .ai-bubble-user.show { opacity: 1; transform: translateX(0); }

    /* Typing indicator */
    .ai-typing {
      width: 100%; max-width: 340px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px 14px 14px 4px;
      padding: 12px 16px;
      display: inline-flex; gap: 5px; align-items: center;
      opacity: 0; transform: translateX(-12px);
      transition: opacity .4s, transform .4s;
      padding-left: 42px;
    }
    .ai-typing.show { opacity: 1; transform: translateX(0); }
    .ai-typing span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); animation: tdot 1.2s ease infinite; }
    .ai-typing span:nth-child(2) { animation-delay: .2s; }
    .ai-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes tdot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* Stat chip */
    .ai-stat {
      width: 100%; max-width: 340px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateY(8px);
      transition: opacity .5s, transform .5s;
    }
    .ai-stat.show { opacity: 1; transform: translateY(0); }
    .ai-stat-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; animation: blink 1.5s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .ai-stat-text { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.85); }
    .ai-stat-sub { font-size: 10px; color: rgba(255,255,255,.4); margin-top: 1px; }
  

    /* ── MOBILE SCALE ── */
    html, body { overflow-x: hidden; }
    @media (max-width: 768px) {
      html { font-size: 87.5%; }
      img, video, iframe { max-width: 100%; }
    }
    </style>
</head>
<body>
<div class="ai-wrap">

  <div class="ai-bubble-bot" id="cb1">
    <div class="ai-bot-avatar">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M8 8V6a4 4 0 018 0v2"/><circle cx="9" cy="14" r="1.5" fill="#fff" stroke="none"/><circle cx="15" cy="14" r="1.5" fill="#fff" stroke="none"/></svg>
    </div>
    <span class="ai-bubble-text">Hello! What can I help you with today?</span>
  </div>

  <div class="ai-bubble-user" id="cu1">I want to confirm my appointment.</div>

  <div class="ai-typing" id="ct1">
    <span></span><span></span><span></span>
  </div>

  <div class="ai-bubble-bot" id="cb2">
    <div class="ai-bot-avatar">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M8 8V6a4 4 0 018 0v2"/><circle cx="9" cy="14" r="1.5" fill="#fff" stroke="none"/><circle cx="15" cy="14" r="1.5" fill="#fff" stroke="none"/></svg>
    </div>
    <span class="ai-bubble-text">Got it! ✅ Appointment confirmed for <strong style="color:#fff">Friday 3:00 PM</strong>. You'll receive a reminder 24h before.</span>
  </div>

  <div class="ai-stat" id="cs1">
    <div class="ai-stat-dot"></div>
    <div>
      <div class="ai-stat-text">AI Copilot Active</div>
      <div class="ai-stat-sub">Avg. 1.8s response time</div>
    </div>
  </div>

</div>
<script>
  function runSequence() {
    ['cb1','cu1','ct1','cb2','cs1'].forEach(id => document.getElementById(id).classList.remove('show'));
    const delays = [300, 900, 1500, 2400, 3100];
    ['cb1','cu1','ct1','cb2','cs1'].forEach((id, i) => {
      setTimeout(() => {
        document.getElementById(id).classList.add('show');
        if (id === 'cb2') setTimeout(() => document.getElementById('ct1').classList.remove('show'), 50);
      }, delays[i]);
    });
  }
  runSequence();
  setInterval(runSequence, 8000);
</script>
</body>
</html>
