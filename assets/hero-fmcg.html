<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – FMCG & Retail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #EEF5FD; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .fg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 100vh; padding: 32px; }

    /* ── Shared card base ── */
    .fg-card {
      width: 100%; max-width: 340px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(13,71,161,.1), 0 2px 8px rgba(0,0,0,.05);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .fg-card.show { opacity: 1; transform: translateY(0); }

    /* ── Card 1: Customer insight ── */
    .fg-profile { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .fg-av {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #0D47A1, #1976D2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
    }
    .fg-profile-info { flex: 1; }
    .fg-profile-name { font-size: 14px; font-weight: 800; color: #0f172a; }
    .fg-profile-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
    .fg-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .fg-tag { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: #EEF5FD; color: #0D47A1; border: 1px solid #dbeafe; }

    /* ── Card 2: Product recommendations ── */
    .fg-rec-head { padding: 12px 16px 8px; border-bottom: 1px solid #f1f5f9; }
    .fg-rec-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; }
    .fg-rec-title { font-size: 13px; font-weight: 800; color: #0f172a; margin-top: 2px; }
    .fg-products { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px 12px; }
    .fg-product {
      background: #f8fafc; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      border: 1px solid #f1f5f9; cursor: pointer; transition: border-color .2s, background .2s;
    }
    .fg-product:hover { border-color: #0D47A1; background: #EEF5FD; }
    .fg-product-img { font-size: 28px; }
    .fg-product-name { font-size: 11px; font-weight: 700; color: #0f172a; text-align: center; }
    .fg-product-price { font-size: 12px; font-weight: 800; color: #0D47A1; }
    .fg-add-btn {
      display: block; width: calc(100% - 24px); margin: 0 12px 12px;
      background: #0D47A1; color: #fff; border: none; border-radius: 8px;
      padding: 9px; font-size: 12px; font-weight: 700; cursor: pointer;
      transition: background .2s; text-align: center;
    }
    .fg-add-btn:hover { background: #0a3680; }

    /* ── Card 3: WhatsApp delivery chip ── */
    .fg-delivery { padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .fg-wa-icon {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: #25D366; display: flex; align-items: center; justify-content: center;
    }
    .fg-wa-icon svg { width: 20px; height: 20px; fill: #fff; }
    .fg-delivery-info { flex: 1; }
    .fg-delivery-title { font-size: 12px; font-weight: 800; color: #0f172a; }
    .fg-delivery-sub { font-size: 10px; color: #64748b; margin-top: 2px; }
    .fg-delivery-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  

    /* ── MOBILE SCALE ── */
    html, body { overflow-x: hidden; }
    @media (max-width: 768px) {
      html { font-size: 87.5%; }
      img, video, iframe { max-width: 100%; }
    }
    </style>
</head>
<body>
<div class="fg">

  <!-- Card 1: Customer insight -->
  <div class="fg-card" id="c1">
    <div class="fg-profile">
      <div class="fg-av">AK</div>
      <div class="fg-profile-info">
        <div class="fg-profile-name">Akosua Koomson</div>
        <div class="fg-profile-sub">Loyal customer · 3 years</div>
        <div class="fg-tags">
          <span class="fg-tag">🛒 Groceries</span>
          <span class="fg-tag">🥑 Fresh Produce</span>
          <span class="fg-tag">Weekly Shopper</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Card 2: Product recommendations -->
  <div class="fg-card" id="c2">
    <div class="fg-rec-head">
      <div class="fg-rec-label">Recommended for you</div>
      <div class="fg-rec-title">Complete your weekly list, Akosua 🛍️</div>
    </div>
    <div class="fg-products">
      <div class="fg-product">
        <div class="fg-product-img">🥑</div>
        <div class="fg-product-name">Hass Avocado</div>
        <div class="fg-product-price">GH₵ 12.00</div>
      </div>
      <div class="fg-product">
        <div class="fg-product-img">🥛</div>
        <div class="fg-product-name">Cowbell Milk</div>
        <div class="fg-product-price">GH₵ 8.50</div>
      </div>
    </div>
    <div class="fg-add-btn">Add to Cart →</div>
  </div>

  <!-- Card 3: WhatsApp delivery -->
  <div class="fg-card" id="c3">
    <div class="fg-delivery">
      <div class="fg-wa-icon">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </div>
      <div class="fg-delivery-info">
        <div class="fg-delivery-title">Message delivered via WhatsApp</div>
        <div class="fg-delivery-sub">Akosua Koomson · Just now · ✓✓ Read</div>
      </div>
      <div class="fg-delivery-dot"></div>
    </div>
  </div>

</div>
<script>
  function runSequence() {
    ['c1','c2','c3'].forEach(id => document.getElementById(id).classList.remove('show'));
    const delays = [300, 900, 1600];
    ['c1','c2','c3'].forEach((id, i) => setTimeout(() => document.getElementById(id).classList.add('show'), delays[i]));
  }
  runSequence();
  setInterval(runSequence, 7000);
</script>
</body>
</html>
