<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Knowledge Base</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; background: #f8fafc; }

    .kb { display: flex; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: #fff; }

    /* ── Top bar ── */
    .kb-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
    .kb-logo { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .kb-logo-icon { width: 28px; height: 28px; background: #0D47A1; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; }
    .kb-logo-text { font-size: 13px; font-weight: 800; color: #0f172a; }
    .kb-search-wrap { flex: 1; position: relative; }
    .kb-search { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px 12px 7px 32px; font-size: 13px; color: #374151; outline: none; font-family: inherit; background: #f8fafc; transition: border .2s, background .2s; }
    .kb-search:focus { border-color: #93c5fd; background: #fff; }
    .kb-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; pointer-events: none; }
    .kb-toggle-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .kb-toggle-label { font-size: 12px; font-weight: 700; color: #374151; white-space: nowrap; }
    .kb-toggle { position: relative; width: 36px; height: 20px; cursor: pointer; }
    .kb-toggle input { opacity: 0; width: 0; height: 0; }
    .kb-slider { position: absolute; inset: 0; background: #0D47A1; border-radius: 10px; transition: background .3s; }
    .kb-slider::before { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .3s; transform: translateX(16px); }
    .kb-notif { position: relative; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #64748b; font-size: 18px; flex-shrink: 0; }
    .kb-notif-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; border: 2px solid #fff; }

    /* ── Body ── */
    .kb-body { display: flex; flex: 1; overflow: hidden; }

    /* Left icon nav */
    .kb-sidenav { width: 48px; background: #fff; border-right: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; flex-shrink: 0; }
    .kb-si { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 15px; cursor: pointer; transition: all .2s; }
    .kb-si:hover { background: #f1f5f9; color: #0D47A1; }
    .kb-si.on { background: #EEF5FD; color: #0D47A1; }
    .kb-sig { flex: 1; }

    /* ── Main content ── */
    .kb-content { flex: 1; display: flex; overflow: hidden; min-width: 0; }

    /* Left: cards area */
    .kb-cards-area { flex: 1; padding: 14px 16px; overflow-y: auto; }
    .kb-content-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .kb-content-title { font-size: 15px; font-weight: 800; color: #0f172a; }
    .kb-head-btns { display: flex; gap: 8px; }
    .kb-hbtn { padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid #e2e8f0; background: #fff; color: #475569; display: flex; align-items: center; gap: 5px; transition: all .15s; }
    .kb-hbtn:hover { border-color: #93c5fd; color: #0D47A1; }
    .kb-hbtn.pri { background: #0D47A1; color: #fff; border-color: #0D47A1; }
    .kb-hbtn.pri:hover { background: #0a3a84; }

    /* Card grid */
    .kb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kb-card { border: 1px solid #f1f5f9; border-radius: 10px; padding: 12px 12px 10px; background: #fff; cursor: pointer; transition: all .2s; position: relative; overflow: hidden; }
    .kb-card:hover { border-color: #93c5fd; box-shadow: 0 4px 16px rgba(13,71,161,.08); transform: translateY(-1px); }
    .kb-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
    .kb-card-icon-wrap { width: 36px; height: 36px; background: #EEF5FD; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .kb-card-prog { position: relative; width: 36px; height: 36px; }
    .kb-card-prog svg { transform: rotate(-90deg); }
    .kb-prog-bg { fill: none; stroke: #f1f5f9; stroke-width: 3; }
    .kb-prog-fill { fill: none; stroke: #0D47A1; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
    .kb-prog-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #0D47A1; }
    .kb-card-title { font-size: 12px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .kb-card-desc { font-size: 11px; color: #64748b; line-height: 1.45; margin-bottom: 8px; }
    .kb-card-link { font-size: 11px; font-weight: 700; color: #0D47A1; }

    /* Semantic chunks row */
    .kb-chunks { margin-top: 14px; }
    .kb-chunks-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 10px; }
    .kb-chunks-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .kb-chunk { flex-shrink: 0; width: 160px; border: 1px solid #f1f5f9; border-radius: 10px; padding: 10px; background: #fff; cursor: pointer; transition: all .2s; }
    .kb-chunk:hover { border-color: #93c5fd; box-shadow: 0 3px 12px rgba(13,71,161,.08); }
    .kb-chunk-badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; display: inline-block; margin-bottom: 7px; }
    .cb-from { background: #EEF5FD; color: #0D47A1; }
    .cb-dev { background: #f0fdf4; color: #15803d; }
    .kb-chunk-title { font-size: 11px; font-weight: 800; color: #0f172a; margin-bottom: 5px; line-height: 1.3; }
    .kb-chunk-desc { font-size: 10px; color: #64748b; line-height: 1.45; margin-bottom: 8px; }
    .kb-chunk-btn { font-size: 10px; font-weight: 700; color: #0D47A1; background: #EEF5FD; padding: 3px 8px; border-radius: 4px; border: none; cursor: pointer; }

    /* ── Right: Network graph ── */
    .kb-graph-panel { width: 260px; border-left: 1px solid #f1f5f9; padding: 14px 12px; display: flex; flex-direction: column; flex-shrink: 0; }
    .kb-graph-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 10px; }
    .kb-graph-svg { flex: 1; }
  

    /* ── MOBILE SCALE ── */
    html, body { overflow-x: hidden; }
    @media (max-width: 768px) {
      html { font-size: 87.5%; }
      img, video, iframe { max-width: 100%; }
    }
    </style>
</head>
<body>
<div class="kb">

  <!-- Cards area -->
  <div class="kb-cards-area" style="flex:1;padding:14px 16px;overflow-y:auto;">
    <div class="kb-content-head">
      <span class="kb-content-title">Knowledge Center</span>
      <div class="kb-head-btns">
        <button class="kb-hbtn">⊞ Tiny chunk</button>
        <button class="kb-hbtn pri">+ Create chunk</button>
      </div>
    </div>

    <div class="kb-grid" id="cardGrid"></div>

    <div class="kb-chunks">
      <div class="kb-chunks-label">Semantic Chunks</div>
      <div class="kb-chunks-row" id="chunksRow"></div>
    </div>
  </div>
</div>

<script>
  // ── Cards ──
  const CARDS = [
    { icon:'📄', title:'PDFs',        desc:'Search chunks for documentation data…', prog:62 },
    { icon:'☁️', title:'Cloud Docs',  desc:'Search chunks for cloud new data…',      prog:45 },
    { icon:'☁️', title:'Cloud Docs',  desc:'Search chunks for cloud new data…',      prog:78 },
    { icon:'🔗', title:'Web Links',   desc:'Search chunks for data front data…',     prog:34 },
    { icon:'🔗', title:'Web Links',   desc:'Search chunks for data front data…',     prog:55 },
    { icon:'🔗', title:'Web Links',   desc:'Search chunks for data front data…',     prog:89 },
  ];

  const CIRC = 2 * Math.PI * 15; // circumference for r=15

  document.getElementById('cardGrid').innerHTML = CARDS.map((c,i) => {
    const offset = CIRC * (1 - c.prog / 100);
    return `
      <div class="kb-card">
        <div class="kb-card-top">
          <div class="kb-card-icon-wrap">${c.icon}</div>
          <div class="kb-card-prog">
            <svg width="36" height="36" viewBox="0 0 36 36">
              <circle class="kb-prog-bg" cx="18" cy="18" r="15"/>
              <circle class="kb-prog-fill" cx="18" cy="18" r="15"
                stroke-dasharray="${CIRC}" stroke-dashoffset="${offset}"/>
            </svg>
            <div class="kb-prog-text">${c.prog}%</div>
          </div>
        </div>
        <div class="kb-card-title">${c.title}</div>
        <div class="kb-card-desc">${c.desc}</div>
        <div class="kb-card-link">Progress →</div>
      </div>`;
  }).join('');

  // ── Semantic chunks ──
  const CHUNKS = [
    { badge:'cb-from', badgeText:'From chunk', title:'New from Chunk', desc:'Lorem ipsum dolor sit amet, consectetur adipiscing elit.' },
    { badge:'cb-dev',  badgeText:'Developed',  title:'Developed it',   desc:'Lorem ipsum dolor sit amet, consectetur adipiscing elit.' },
    { badge:'cb-from', badgeText:'From chunk', title:'New from Chunk', desc:'Lorem ipsum dolor sit amet, consectetur adipiscing elit.' },
    { badge:'cb-dev',  badgeText:'Semantic',   title:'Chunk Analysis', desc:'Sed do eiusmod tempor incididunt ut labore et dolore.' },
  ];

  document.getElementById('chunksRow').innerHTML = CHUNKS.map(c => `
    <div class="kb-chunk">
      <span class="kb-chunk-badge ${c.badge}">${c.badgeText}</span>
      <div class="kb-chunk-title">${c.title}</div>
      <div class="kb-chunk-desc">${c.desc}</div>
      <button class="kb-chunk-btn">Learn More</button>
    </div>`).join('');

  // ── Network graph ──
  const svg = document.getElementById('graphSvg');

  // Node definitions [x, y, radius, label]
  const NODES = [
    [120, 30,  9,  'Hub'],
    [60,  70,  7,  ''],
    [180, 70,  7,  ''],
    [30,  120, 6,  ''],
    [100, 110, 8,  ''],
    [155, 115, 6,  ''],
    [210, 120, 5,  ''],
    [50,  175, 7,  ''],
    [120, 170, 9,  'Core'],
    [190, 170, 6,  ''],
    [75,  225, 6,  ''],
    [145, 230, 7,  ''],
    [215, 235, 5,  ''],
    [30,  280, 5,  ''],
    [110, 285, 6,  ''],
    [175, 280, 8,  ''],
    [240, 270, 5,  ''],
  ];

  // Edges [from, to]
  const EDGES = [
    [0,1],[0,2],[1,3],[1,4],[2,5],[2,6],
    [3,7],[4,7],[4,8],[5,8],[5,9],[6,9],
    [7,10],[8,10],[8,11],[9,11],[9,12],
    [10,13],[10,14],[11,14],[11,15],[12,15],[12,16],
    [13,14],[14,15],[15,16],
  ];

  // Draw edges
  EDGES.forEach(([a,b]) => {
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', NODES[a][0]);
    line.setAttribute('y1', NODES[a][1]);
    line.setAttribute('x2', NODES[b][0]);
    line.setAttribute('y2', NODES[b][1]);
    line.setAttribute('stroke', 'rgba(13,71,161,.18)');
    line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
  });

  // Animated edge pulses
  function animatePulse() {
    const edge = EDGES[Math.floor(Math.random() * EDGES.length)];
    const a = NODES[edge[0]], b = NODES[edge[1]];
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('r', '3');
    circle.setAttribute('fill', '#0D47A1');
    circle.setAttribute('opacity', '0.8');
    svg.appendChild(circle);

    let t = 0;
    const anim = setInterval(() => {
      t += 0.04;
      if (t >= 1) { clearInterval(anim); svg.removeChild(circle); return; }
      const x = a[0] + (b[0] - a[0]) * t;
      const y = a[1] + (b[1] - a[1]) * t;
      circle.setAttribute('cx', x);
      circle.setAttribute('cy', y);
      circle.setAttribute('opacity', 1 - t * 0.5);
    }, 30);
  }
  setInterval(animatePulse, 600);

  // Draw nodes
  NODES.forEach(([x, y, r, label]) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', x);
    circle.setAttribute('cy', y);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', r >= 8 ? '#0D47A1' : '#93c5fd');
    circle.setAttribute('stroke', '#fff');
    circle.setAttribute('stroke-width', '1.5');
    g.appendChild(circle);

    if (label) {
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', x);
      text.setAttribute('y', y - r - 3);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', '8');
      text.setAttribute('fill', '#64748b');
      text.setAttribute('font-family', 'sans-serif');
      text.textContent = label;
      g.appendChild(text);
    }

    svg.appendChild(g);
  });
</script>
</body>
</html>
