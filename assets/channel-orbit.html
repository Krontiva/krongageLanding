<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage Channel Orbit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .orbit-wrap {
      position: relative;
      width: 440px;
      height: 440px;
    }

    /* Decorative ring */
    .orbit-ring {
      position: absolute;
      inset: 26px;
      border-radius: 50%;
      border: 1.5px dashed rgba(13,71,161,.15);
      pointer-events: none;
    }

    /* Center logo */
    .orbit-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 116px; height: 116px;
      background: #fff;
      border-radius: 30px;
      box-shadow: 0 8px 48px rgba(13,71,161,.22), 0 2px 8px rgba(0,0,0,.07);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .orbit-center img { width: 80px; height: 80px; object-fit: contain; }

    /* Icon slots – positioned by JS */
    .icon-slot {
      position: absolute;
      top: 50%; left: 50%;
      width: 64px; height: 64px;
      margin: -32px 0 0 -32px;
      /* JS sets transform: translate(x,y) */
    }

    .chip {
      width: 64px; height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 22px rgba(0,0,0,.18), 0 1px 4px rgba(0,0,0,.08);
      cursor: pointer;
      transition: transform .22s, box-shadow .22s;
    }
    .chip:hover {
      transform: scale(1.13);
      box-shadow: 0 12px 36px rgba(0,0,0,.26);
    }
    .chip svg { width: 34px; height: 34px; }
  

    /* ── MOBILE SCALE ── */
    html, body { overflow-x: hidden; }
    @media (max-width: 768px) {
      html { font-size: 87.5%; }
    }
    @media (max-width: 480px) {
      .orbit-wrap {
        transform: scale(0.82);
        transform-origin: center center;
      }
    }
    @media (max-width: 380px) {
      .orbit-wrap {
        transform: scale(0.70);
        transform-origin: center center;
      }
    }
    </style>
</head>
<body>

</div>

<script>
  const slots = document.querySelectorAll('.icon-slot');
  const N = slots.length;
  const RADIUS = 182;
  let paused = false;
  let angle = -Math.PI / 2; // start at top

  // Speed: full revolution every 20s → radians per ms
  const SPEED = (2 * Math.PI) / 20000;

  let last = null;

  function step(ts) {
    if (last !== null && !paused) {
      angle += SPEED * (ts - last);
    }
    last = ts;

    slots.forEach((slot, i) => {
      const a = angle + (i * 2 * Math.PI) / N;
      const x = Math.cos(a) * RADIUS;
      const y = Math.sin(a) * RADIUS;
      slot.style.transform = `translate(${x}px, ${y}px)`;
    });

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);

  // Pause on hover
  const wrap = document.querySelector('.orbit-wrap');
  wrap.addEventListener('mouseenter', () => paused = true);
  wrap.addEventListener('mouseleave', () => paused = false);
</script>

</body>
</html>
