<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Social Publishing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; background: #f0f4f8; }

    .sp { display: flex; width: 100%; height: 100vh; overflow: hidden; }

    /* ── Dark left sidebar ── */
    .sp-side { width: 168px; background: #0f172a; display: flex; flex-direction: column; padding: 16px 0; flex-shrink: 0; }
    .sp-logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 20px; }
    .sp-logo-icon { width: 30px; height: 30px; background: #0D47A1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; }
    .sp-logo-text { font-size: 14px; font-weight: 800; color: #fff; }
    .sp-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.5); cursor: pointer; transition: all .2s; border-radius: 0; position: relative; }
    .sp-nav-item:hover { color: #fff; background: rgba(255,255,255,.06); }
    .sp-nav-item.on { color: #fff; background: rgba(13,71,161,.4); }
    .sp-nav-item.on::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: #0D47A1; border-radius: 0 2px 2px 0; }
    .sp-nav-icon { width: 16px; height: 16px; opacity: .7; }
    .sp-nav-item.on .sp-nav-icon { opacity: 1; }
    .sp-badge { background: #0D47A1; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: auto; }
    .sp-gap { flex: 1; }
    .sp-engagement { margin: 0 12px 8px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 10px 12px; }
    .sp-eng-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: rgba(255,255,255,.4); margin-bottom: 4px; }
    .sp-eng-val { font-size: 18px; font-weight: 800; color: #38bdf8; letter-spacing: -.5px; }
    .sp-eng-chart { margin-top: 8px; height: 32px; }

    /* ── Main area ── */
    .sp-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: #fff; }
    .sp-topbar { padding: 14px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .sp-page-title { font-size: 18px; font-weight: 800; color: #0f172a; }
    .sp-page-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .sp-cta-btn { background: #0D47A1; color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .2s; display: flex; align-items: center; gap: 6px; }
    .sp-cta-btn:hover { background: #0a3a84; }

    .sp-body { flex: 1; display: grid; grid-template-columns: 1fr 1.1fr; gap: 0; overflow: hidden; }

    /* Left: Feed Preview */
    .sp-left { padding: 16px 16px 16px 20px; overflow-y: auto; border-right: 1px solid #f1f5f9; }
    .sp-sec-title { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }

    /* Instagram card */
    .sp-ig-card { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .sp-ig-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #f8fafc; }
    .sp-ig-brand { display: flex; align-items: center; gap: 8px; }
    .sp-ig-logo { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#f9a825,#e91e63,#9c27b0); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 900; }
    .sp-ig-name { font-size: 12px; font-weight: 700; color: #0f172a; }
    .sp-ig-dots { color: #94a3b8; cursor: pointer; letter-spacing: 1px; font-size: 16px; line-height: 1; }
    .sp-ig-img { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 50%, #fce7f3 100%); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .sp-ig-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; gap: 2px; }
    .sp-ig-cell { background: linear-gradient(135deg,#c7d2fe,#a5b4fc); }
    .sp-ig-cell:nth-child(2) { background: linear-gradient(135deg,#fde68a,#fca5a5); }
    .sp-ig-cell:nth-child(3) { background: linear-gradient(135deg,#a7f3d0,#6ee7b7); }
    .sp-ig-cell:nth-child(4) { background: linear-gradient(135deg,#fbcfe8,#f9a8d4); }
    .sp-ig-actions { display: flex; align-items: center; gap: 12px; padding: 9px 12px 6px; }
    .sp-ig-act { font-size: 16px; cursor: pointer; transition: transform .2s; }
    .sp-ig-act:hover { transform: scale(1.2); }
    .sp-ig-bookmark { margin-left: auto; }
    .sp-ig-stats { padding: 2px 12px 8px; font-size: 11px; color: #64748b; }
    .sp-ig-stats strong { color: #0f172a; }
    .sp-ig-caption { padding: 0 12px 10px; font-size: 11px; color: #374151; line-height: 1.5; }
    .sp-ig-caption strong { color: #0f172a; font-weight: 700; }
    .sp-ig-comments { padding: 0 12px 10px; font-size: 11px; color: #0D47A1; cursor: pointer; }
    .sp-ig-time { padding: 0 12px 10px; font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: .3px; }
    .sp-ig-add-comment { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid #f8fafc; }
    .sp-ig-com-av { width: 22px; height: 22px; border-radius: 50%; background: #0D47A1; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .sp-ig-com-inp { flex: 1; font-size: 11px; color: #94a3b8; }
    .sp-ig-reach { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 10px 12px; background: #f8fafc; border-radius: 8px; border: 1px solid #f1f5f9; }
    .sp-ig-reach-label { font-size: 11px; color: #64748b; }
    .sp-ig-reach-val { font-size: 14px; font-weight: 800; color: #0D47A1; }

    /* Right: Calendar */
    .sp-right { padding: 16px 20px 16px 16px; overflow-y: auto; }
    .sp-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .sp-cal-top-right { display: flex; align-items: center; gap: 8px; }
    .sp-cal-btn { padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 11px; font-weight: 600; background: #fff; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .sp-cal-btn.pri { background: #0D47A1; color: #fff; border-color: #0D47A1; }
    .sp-reach-stat { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .sp-reach-info { display: flex; flex-direction: column; }
    .sp-reach-lbl { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .sp-reach-num { font-size: 20px; font-weight: 800; color: #0D47A1; letter-spacing: -.5px; }
    .sp-reach-chart { width: 90px; height: 36px; }

    /* Calendar grid */
    .sp-cal { border: 1px solid #f1f5f9; border-radius: 10px; overflow: hidden; }
    .sp-cal-days { display: grid; grid-template-columns: repeat(5, 1fr); background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
    .sp-cal-day { padding: 7px 8px; font-size: 11px; font-weight: 700; color: #64748b; text-align: center; }
    .sp-cal-body { display: grid; grid-template-columns: repeat(5, 1fr); min-height: 200px; gap: 0; }
    .sp-cal-col { border-right: 1px solid #f8fafc; padding: 6px 4px; display: flex; flex-direction: column; gap: 4px; }
    .sp-cal-col:last-child { border-right: none; }
    .sp-cal-block { border-radius: 5px; padding: 4px 6px; font-size: 10px; font-weight: 600; cursor: pointer; transition: opacity .2s; position: relative; }
    .sp-cal-block:hover { opacity: .85; }
    .cb-tw { background: #e0f2fe; color: #0284c7; }
    .cb-ig { background: #fce7f3; color: #be185d; }
    .cb-li { background: #dbeafe; color: #1d4ed8; }
    .cb-fb { background: #ede9fe; color: #7c3aed; }
    .cb-tt { background: #f0fdf4; color: #15803d; }
    .sp-platform-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .sp-leg-item { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #475569; }
    .sp-leg-dot { width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>
<div class="sp" style="background:#fff;">

  <!-- Main -->
  <div class="sp-main">
    <div class="sp-topbar">
      <div>
        <div class="sp-page-title">Social Publishing</div>
        <div class="sp-page-sub">Content Calendar</div>
      </div>
      <button class="sp-cta-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="white"><path d="M8 1v14M1 8h14" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        Create Post
      </button>
    </div>

    <div class="sp-body" style="display:block;overflow-y:auto;">
      <!-- Calendar only -->
      <div class="sp-right" style="padding:16px 20px;">
        <!-- Reach stat -->
        <div class="sp-reach-stat">
          <div class="sp-reach-info">
            <span class="sp-reach-lbl">Reach</span>
            <span class="sp-reach-num">21,633</span>
          </div>
          <svg class="sp-reach-chart" viewBox="0 0 90 36" preserveAspectRatio="none">
            <polyline points="0,30 15,22 30,26 45,10 60,18 75,8 90,14"
              fill="none" stroke="#0D47A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="0,36 0,30 15,22 30,26 45,10 60,18 75,8 90,14 90,36"
              fill="rgba(13,71,161,.08)" stroke="none"/>
          </svg>
        </div>

        <!-- Calendar label -->
        <div class="sp-cal-header">
          <div class="sp-sec-title" style="margin:0;">Content Calendar</div>
          <div style="font-size:11px;font-weight:700;color:#94a3b8;">Week ∨</div>
        </div>

        <!-- Calendar grid -->
        <div class="sp-cal">
          <div class="sp-cal-days">
            <div class="sp-cal-day">Mon</div>
            <div class="sp-cal-day">Tue</div>
            <div class="sp-cal-day">Wed</div>
            <div class="sp-cal-day">Thu</div>
            <div class="sp-cal-day">Fri</div>
          </div>
          <div class="sp-cal-body" id="calBody"></div>
        </div>

        <div class="sp-platform-legend">
          <div class="sp-leg-item"><div class="sp-leg-dot" style="background:#0284c7"></div>X / Twitter</div>
          <div class="sp-leg-item"><div class="sp-leg-dot" style="background:#be185d"></div>Instagram</div>
          <div class="sp-leg-item"><div class="sp-leg-dot" style="background:#1d4ed8"></div>LinkedIn</div>
          <div class="sp-leg-item"><div class="sp-leg-dot" style="background:#7c3aed"></div>Facebook</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Build calendar columns
  const CAL = [
    // Mon
    [
      { cls:'cb-tw', text:'X · 9:00 AM' },
      { cls:'cb-li', text:'LinkedIn · 11:00' },
      { cls:'cb-tw', text:'X · 4:00 PM' },
    ],
    // Tue
    [
      { cls:'cb-ig', text:'IG · 10:00 AM' },
      { cls:'cb-fb', text:'FB · 2:00 PM' },
    ],
    // Wed
    [
      { cls:'cb-li', text:'LinkedIn · 8:00' },
      { cls:'cb-ig', text:'IG · 1:00 PM' },
      { cls:'cb-tw', text:'X · 5:00 PM' },
      { cls:'cb-fb', text:'FB · 7:00 PM' },
    ],
    // Thu
    [
      { cls:'cb-ig', text:'IG · 9:00 AM' },
      { cls:'cb-tw', text:'X · 3:00 PM' },
    ],
    // Fri
    [
      { cls:'cb-fb', text:'FB · 10:00' },
      { cls:'cb-li', text:'LinkedIn · 12:00' },
      { cls:'cb-ig', text:'IG · 4:00 PM' },
    ],
  ];

  const body = document.getElementById('calBody');
  CAL.forEach(col => {
    const div = document.createElement('div');
    div.className = 'sp-cal-col';
    div.innerHTML = col.map(b => `<div class="sp-cal-block ${b.cls}">${b.text}</div>`).join('');
    body.appendChild(div);
  });
</script>
</body>
</html>
