<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronGage – Security</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #0d2150 50%, #0a1628 100%); }

    .sec { display: flex; width: 100%; height: 100vh; align-items: center; justify-content: center; overflow: hidden; }

    /* ── Hexagonal visual ── */
    .sec-visual { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; height: 100vh; }

    /* Hex frame */
    .sec-hex-wrap { position: relative; width: 280px; height: 320px; display: flex; align-items: center; justify-content: center; }

    .sec-hex-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1565C0, #0D47A1, #1976D2);
      clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
      z-index: 1;
    }

    /* Animated facets */
    .sec-hex-facets {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    }
    .sec-facet {
      position: absolute;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      animation: facetPulse 3s ease-in-out infinite;
    }
    .sec-facet:nth-child(1) { width: 90px; height: 90px; top: 10px; left: 30px; clip-path: polygon(50% 0%,100% 50%,50% 100%,0% 50%); animation-delay: 0s; }
    .sec-facet:nth-child(2) { width: 70px; height: 70px; top: 20px; right: 40px; clip-path: polygon(50% 0%,100% 50%,50% 100%,0% 50%); animation-delay: .5s; }
    .sec-facet:nth-child(3) { width: 110px; height: 60px; top: 50px; left: 10px; clip-path: polygon(25% 0%,75% 0%,100% 100%,0% 100%); animation-delay: .8s; }
    .sec-facet:nth-child(4) { width: 80px; height: 80px; bottom: 30px; right: 20px; clip-path: polygon(50% 0%,100% 50%,50% 100%,0% 50%); animation-delay: 1.2s; }
    .sec-facet:nth-child(5) { width: 60px; height: 100px; bottom: 10px; left: 40px; clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); animation-delay: 1.6s; }
    @keyframes facetPulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    /* Inner rounded card */
    .sec-inner-card {
      position: relative;
      z-index: 10;
      width: 200px;
      height: 240px;
      background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Person silhouette */
    .sec-person { position: relative; width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; }
    .sec-person-circle { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #42a5f5, #1565C0); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(13,71,161,.5); margin-bottom: 6px; }
    .sec-person-icon { font-size: 36px; }
    .sec-person-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(13,71,161,.3), transparent 70%); pointer-events: none; }

    /* Pulse rings */
    .sec-pulse { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); border-radius: 50%; border: 1.5px solid rgba(66,165,245,.4); animation: pulsering 2.5s ease-out infinite; pointer-events: none; }
    .sec-pulse:nth-child(2) { animation-delay: .8s; }
    .sec-pulse:nth-child(3) { animation-delay: 1.6s; }
    @keyframes pulsering {
      0% { width: 80px; height: 80px; opacity: .8; }
      100% { width: 200px; height: 200px; opacity: 0; }
    }

    /* Lock badge */
    .sec-lock-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 20;
      width: 52px;
      height: 52px;
      background: #0D47A1;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(13,71,161,.6), 0 2px 8px rgba(0,0,0,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: lockBounce 2s ease-in-out infinite;
    }
    @keyframes lockBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

    /* Floating particles */
    .sec-particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(66,165,245,.6); animation: float 4s ease-in-out infinite; pointer-events: none; }
    @keyframes float { 0%,100%{transform:translateY(0) scale(1);opacity:.6} 50%{transform:translateY(-20px) scale(1.3);opacity:1} }

  </style>
</head>
<body>
<div class="sec">

  <!-- Visual hex -->
  <div class="sec-visual">
    <!-- Ambient particles -->
    <div class="sec-particle" style="top:15%;left:20%;animation-delay:0s;"></div>
    <div class="sec-particle" style="top:25%;right:18%;animation-delay:.7s;width:3px;height:3px;"></div>
    <div class="sec-particle" style="top:70%;left:14%;animation-delay:1.3s;"></div>
    <div class="sec-particle" style="top:60%;right:22%;animation-delay:2s;width:3px;height:3px;"></div>
    <div class="sec-particle" style="top:80%;left:40%;animation-delay:.4s;"></div>

    <div class="sec-hex-wrap">
      <div class="sec-hex-bg"></div>
      <div class="sec-hex-facets">
        <div class="sec-facet"></div>
        <div class="sec-facet"></div>
        <div class="sec-facet"></div>
        <div class="sec-facet"></div>
        <div class="sec-facet"></div>
      </div>

      <div class="sec-inner-card">
        <div class="sec-person">
          <div class="sec-pulse"></div>
          <div class="sec-pulse"></div>
          <div class="sec-pulse"></div>
          <div class="sec-person-glow"></div>
          <div style="display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;">
            <div class="sec-person-circle">
              <span class="sec-person-icon">👤</span>
            </div>
            <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);margin-top:6px;">Secure Session</div>
            <div style="font-size:10px;color:rgba(255,255,255,.4);">MFA · Active</div>
          </div>
        </div>
      </div>

      <div class="sec-lock-badge">🔒</div>
    </div>
  </div>


</div>

<script></script>
</body>
</html>
