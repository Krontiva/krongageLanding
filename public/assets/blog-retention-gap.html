<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retention Gap Chart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080e1a; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    svg { width: 100%; height: 100%; display: block; }

    @keyframes gapPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.85; }
    }
    .gap-pulse { animation: gapPulse 4s ease-in-out infinite; }

    @keyframes dotPop {
      0% { r: 0; opacity: 0; }
      60% { r: 5; opacity: 1; }
      100% { r: 3.5; opacity: 0.9; }
    }
  </style>
</head>
<body>
<svg id="chart" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gapGrad" x1="0" y1="85" x2="0" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#ef4444" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#080e1a" stop-opacity="1"/>
      <stop offset="8%"   stop-color="#080e1a" stop-opacity="0"/>
      <stop offset="92%"  stop-color="#080e1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080e1a" stop-opacity="1"/>
    </linearGradient>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowOrange" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="440" fill="#080e1a"/>

  <!-- Subtle grid — horizontal -->
  <line x1="90" y1="85"  x2="860" y2="85"  stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <line x1="90" y1="148" x2="860" y2="148" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <line x1="90" y1="210" x2="860" y2="210" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <line x1="90" y1="273" x2="860" y2="273" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <line x1="90" y1="336" x2="860" y2="336" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>

  <!-- Grid — vertical -->
  <line x1="240" y1="65" x2="240" y2="370" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="390" y1="65" x2="390" y2="370" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="540" y1="65" x2="540" y2="370" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="690" y1="65" x2="690" y2="370" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="840" y1="65" x2="840" y2="370" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90"  y2="372" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="85" y1="368" x2="862" y2="368" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="78" y="89"  text-anchor="end" font-size="11" fill="rgba(255,255,255,0.22)" font-family="system-ui,sans-serif">80%</text>
  <text x="78" y="152" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.22)" font-family="system-ui,sans-serif">62%</text>
  <text x="78" y="214" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.22)" font-family="system-ui,sans-serif">45%</text>
  <text x="78" y="277" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.22)" font-family="system-ui,sans-serif">27%</text>

  <!-- X axis labels -->
  <text x="90"  y="388" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.18)" font-family="system-ui,sans-serif">Q1</text>
  <text x="240" y="388" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.18)" font-family="system-ui,sans-serif">Q2</text>
  <text x="390" y="388" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.18)" font-family="system-ui,sans-serif">Q3</text>
  <text x="540" y="388" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.18)" font-family="system-ui,sans-serif">Q4</text>
  <text x="690" y="388" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.18)" font-family="system-ui,sans-serif">Q5</text>
  <text x="840" y="388" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.18)" font-family="system-ui,sans-serif">Q6</text>

  <!-- Y axis title -->
  <text transform="rotate(-90)" x="-215" y="26" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.18)" font-family="system-ui,sans-serif">Retention Rate</text>

  <!-- Chart title (subtle) -->
  <text x="95" y="44" font-size="12" fill="rgba(255,255,255,0.25)" font-family="system-ui,sans-serif" font-weight="600" letter-spacing="0.8">Customer Retention Over Time</text>

  <!-- ── GAP FILL ── -->
  <!-- Soft ambient glow layer -->
  <path id="gapGlowPath" opacity="0"
    d="M 90,315 C 155,308 200,298 240,292 C 305,284 348,280 390,278 C 460,280 505,285 540,292 C 608,302 652,310 690,316 C 748,320 798,320 840,320 L 840,85 C 798,88 748,93 690,103 C 652,110 608,122 540,138 C 505,148 460,162 390,175 C 348,183 305,198 240,218 C 200,230 155,250 90,275 Z"
    fill="#ef4444" filter="url(#softGlow)"
  />
  <!-- Filled gradient area -->
  <path id="gapFillPath" class="gap-pulse" opacity="0"
    d="M 90,315 C 155,308 200,298 240,292 C 305,284 348,280 390,278 C 460,280 505,285 540,292 C 608,302 652,310 690,316 C 748,320 798,320 840,320 L 840,85 C 798,88 748,93 690,103 C 652,110 608,122 540,138 C 505,148 460,162 390,175 C 348,183 305,198 240,218 C 200,230 155,250 90,275 Z"
    fill="url(#gapGrad)"
  />

  <!-- ── EXPECTED LINE ── (sky blue, dashed, rising) -->
  <!-- glow halo -->
  <path id="expGlow" opacity="0"
    d="M 90,275 C 155,252 200,234 240,218 C 305,198 348,183 390,172 C 460,156 505,142 540,130 C 608,112 652,100 690,92 C 748,84 798,84 840,82"
    fill="none" stroke="rgba(147,197,253,0.35)" stroke-width="12" stroke-linecap="round"
    filter="url(#glowBlue)"
  />
  <!-- line -->
  <path id="expLine" opacity="0"
    d="M 90,275 C 155,252 200,234 240,218 C 305,198 348,183 390,172 C 460,156 505,142 540,130 C 608,112 652,100 690,92 C 748,84 798,84 840,82"
    fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"
    stroke-dasharray="6 8"
  />

  <!-- ── ACTUAL LINE ── (orange, diverges downward from Q3) -->
  <!-- glow halo -->
  <path id="actGlow" opacity="0"
    d="M 90,315 C 155,308 200,298 240,292 C 305,284 348,280 390,278 C 460,282 505,290 540,298 C 608,310 652,316 690,322 C 748,328 798,330 840,332"
    fill="none" stroke="rgba(251,146,60,0.4)" stroke-width="12" stroke-linecap="round"
    filter="url(#glowOrange)"
  />
  <!-- line -->
  <path id="actLine" opacity="0"
    d="M 90,315 C 155,308 200,298 240,292 C 305,284 348,280 390,278 C 460,282 505,290 540,298 C 608,310 652,316 690,322 C 748,328 798,330 840,332"
    fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"
  />

  <!-- ── DATA DOTS — Expected ── -->
  <g id="dotsExp" opacity="0">
    <circle cx="240" cy="218" r="3.5" fill="#93c5fd" filter="url(#dotGlow)"/>
    <circle cx="240" cy="218" r="3.5" fill="#93c5fd"/>
    <circle cx="390" cy="172" r="3.5" fill="#93c5fd" filter="url(#dotGlow)"/>
    <circle cx="390" cy="172" r="3.5" fill="#93c5fd"/>
    <circle cx="540" cy="130" r="3.5" fill="#93c5fd" filter="url(#dotGlow)"/>
    <circle cx="540" cy="130" r="3.5" fill="#93c5fd"/>
    <circle cx="690" cy="92"  r="3.5" fill="#93c5fd" filter="url(#dotGlow)"/>
    <circle cx="690" cy="92"  r="3.5" fill="#93c5fd"/>
    <circle cx="840" cy="82"  r="3.5" fill="#93c5fd" filter="url(#dotGlow)"/>
    <circle cx="840" cy="82"  r="3.5" fill="#93c5fd"/>
  </g>

  <!-- ── DATA DOTS — Actual ── -->
  <g id="dotsAct" opacity="0">
    <circle cx="240" cy="292" r="3.5" fill="#fb923c" filter="url(#dotGlow)"/>
    <circle cx="240" cy="292" r="3.5" fill="#fb923c"/>
    <circle cx="390" cy="278" r="3.5" fill="#fb923c" filter="url(#dotGlow)"/>
    <circle cx="390" cy="278" r="3.5" fill="#fb923c"/>
    <circle cx="540" cy="298" r="3.5" fill="#fb923c" filter="url(#dotGlow)"/>
    <circle cx="540" cy="298" r="3.5" fill="#fb923c"/>
    <circle cx="690" cy="322" r="3.5" fill="#fb923c" filter="url(#dotGlow)"/>
    <circle cx="690" cy="322" r="3.5" fill="#fb923c"/>
    <circle cx="840" cy="332" r="3.5" fill="#fb923c" filter="url(#dotGlow)"/>
    <circle cx="840" cy="332" r="3.5" fill="#fb923c"/>
  </g>

  <!-- ── LINE LABELS ── -->
  <g id="labelExp" opacity="0">
    <rect x="732" y="64" width="96" height="24" rx="5"
      fill="rgba(147,197,253,0.1)" stroke="rgba(147,197,253,0.28)" stroke-width="1"/>
    <text x="780" y="80" text-anchor="middle" font-size="11" font-weight="700"
      fill="#93c5fd" font-family="system-ui,sans-serif">↗ Expected</text>
  </g>

  <g id="labelAct" opacity="0">
    <rect x="732" y="318" width="96" height="24" rx="5"
      fill="rgba(251,146,60,0.1)" stroke="rgba(251,146,60,0.28)" stroke-width="1"/>
    <text x="780" y="334" text-anchor="middle" font-size="11" font-weight="700"
      fill="#fb923c" font-family="system-ui,sans-serif">↘ Actual</text>
  </g>

  <!-- ── THE GAP ANNOTATION ── -->
  <g id="labelGap" opacity="0">
    <!-- Vertical bracket -->
    <line x1="624" y1="103" x2="624" y2="320"
      stroke="rgba(239,68,68,0.45)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <line x1="617" y1="103" x2="631" y2="103"
      stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="617" y1="320" x2="631" y2="320"
      stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Pill label -->
    <rect x="635" y="196" width="70" height="34" rx="8"
      fill="rgba(239,68,68,0.14)" stroke="rgba(239,68,68,0.38)" stroke-width="1"/>
    <text x="670" y="210" text-anchor="middle" font-size="10" font-weight="800"
      fill="#fca5a5" font-family="system-ui,sans-serif" letter-spacing="0.6">THE GAP</text>
    <text x="670" y="223" text-anchor="middle" font-size="10" font-weight="600"
      fill="rgba(252,165,165,0.55)" font-family="system-ui,sans-serif">~250pp</text>
  </g>

  <!-- ── DIVERGENCE MARKER at Q3 ── -->
  <g id="markerQ3" opacity="0">
    <circle cx="390" cy="224" r="20" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="390" y="260" text-anchor="middle" font-size="9" fill="rgba(239,68,68,0.55)"
      font-family="system-ui,sans-serif" font-weight="700">diverges here</text>
  </g>

  <!-- Edge fade overlay (left + right fade for cinematic feel) -->
  <rect width="900" height="440" fill="url(#bgFade)" pointer-events="none"/>
</svg>

<script>
  function fade(el, to, duration, delay) {
    setTimeout(() => {
      el.style.transition = `opacity ${duration}ms ease`;
      el.style.opacity = to;
    }, delay);
  }

  function drawPath(lineEl, glowEl, duration, delay) {
    [lineEl, glowEl].forEach(el => {
      const len = el.getTotalLength ? el.getTotalLength() : 800;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      el.style.opacity = '1';
    });
    setTimeout(() => {
      [lineEl, glowEl].forEach(el => {
        el.style.transition = `stroke-dashoffset ${duration}ms cubic-bezier(0.4,0,0.2,1)`;
        el.style.strokeDashoffset = '0';
      });
    }, delay);
  }

  window.addEventListener('load', () => {
    const T = 300; // base delay offset

    // 1. Draw expected line
    drawPath(
      document.getElementById('expLine'),
      document.getElementById('expGlow'),
      1800, T
    );

    // 2. Draw actual line (slight overlap)
    drawPath(
      document.getElementById('actLine'),
      document.getElementById('actGlow'),
      1800, T + 400
    );

    // 3. Fade in gap fill
    fade(document.getElementById('gapGlowPath'), '0.12', 1200, T + 1800);
    fade(document.getElementById('gapFillPath'), '1',    1200, T + 1800);

    // 4. Dots
    fade(document.getElementById('dotsExp'), '1', 600, T + 1600);
    fade(document.getElementById('dotsAct'), '1', 600, T + 1800);

    // 5. Labels
    fade(document.getElementById('labelExp'),  '1', 700, T + 2100);
    fade(document.getElementById('labelAct'),  '1', 700, T + 2300);
    fade(document.getElementById('labelGap'),  '1', 700, T + 2500);
    fade(document.getElementById('markerQ3'),  '1', 600, T + 2700);
  });
</script>
</body>
</html>
